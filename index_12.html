<title>Chiffrage Géothermie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F5F4; --panel:#FFFFFF; --panel2:#EAEEEC; --ink:#17221F; --ink2:#4E5C58; --ink3:#83908C;
  --line:#D5DDDA; --accent:#0E5E78; --accent-ink:#FFFFFF; --accent-soft:#DCEBF0;
  --racc:#0E5E78; --forage:#A4581C; --loc:#4F6B3A;
  --racc-soft:#E0EDF2; --forage-soft:#F5E7DA; --loc-soft:#E6EDDF;
  --auto:#2F7A5B; --warn:#A8471B; --focus:#1C8FB5;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 18px rgba(20,40,35,.06);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#111816; --panel:#18211F; --panel2:#1F2A27; --ink:#E4ECE9; --ink2:#A6B4AF; --ink3:#71807B;
  --line:#2C3935; --accent:#4DB3D4; --accent-ink:#06222C; --accent-soft:#16333D;
  --racc:#5DB6D6; --forage:#E09356; --loc:#9CBF7E;
  --racc-soft:#15303A; --forage-soft:#3A2819; --loc-soft:#23301B;
  --auto:#6CC79E; --warn:#F08A5B; --focus:#5CC3E6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111816; --panel:#18211F; --panel2:#1F2A27; --ink:#E4ECE9; --ink2:#A6B4AF; --ink3:#71807B;
  --line:#2C3935; --accent:#4DB3D4; --accent-ink:#06222C; --accent-soft:#16333D;
  --racc:#5DB6D6; --forage:#E09356; --loc:#9CBF7E;
  --racc-soft:#15303A; --forage-soft:#3A2819; --loc-soft:#23301B;
  --auto:#6CC79E; --warn:#F08A5B; --focus:#5CC3E6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.005em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:end;gap:8px 20px}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.brand .logo{flex:none;height:46px;width:auto;background:#fff;border-radius:6px;padding:3px 5px}
.brand h1{font-size:22px;font-weight:800;line-height:1}
.brand small{display:block;font-family:var(--body);font-stretch:100%;font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.02em;margin-top:3px}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;padding:10px 14px 11px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:4px}

/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}

.view{padding-top:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.toolbar .title{font-family:var(--display);font-stretch:85%;font-size:26px;font-weight:800;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.status{font-size:13px;color:var(--ink3)}
.status.dirty{color:var(--warn)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:700}
.card-b{padding:14px 16px}

/* chantier */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--focus);outline:none}
.f textarea{resize:vertical;min-height:38px}

.params{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:720px){.params{grid-template-columns:minmax(0,1fr)}}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.pgrid .f input{font-family:var(--mono);font-size:17px;font-weight:500}
.unit-in{position:relative}
.unit-in span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink3);pointer-events:none}
.derived{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--ink2)}
.derived b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.coupe{background:var(--panel2);border-radius:8px;padding:8px;display:flex;flex-direction:column}
.coupe svg{width:100%;height:auto;display:block}
.coupe .cap{font-size:12px;color:var(--ink3);padding:2px 4px 0}

/* sections */
.sec{margin-top:18px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sec-h .sw{width:10px;height:28px;border-radius:2px;flex:none}
.sec-h h2{font-size:19px;font-weight:800}
.sec-h .sub{font-size:13px;color:var(--ink3)}
.sec-h .sum{margin-left:auto;text-align:right}
.sec-h .sum .num{font-size:17px;font-weight:500}
.sec-h .sum small{display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
th.r,td.r{text-align:right}
td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.grp td{background:var(--panel2);font-family:var(--display);font-stretch:85%;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--ink2);padding:6px 10px}
tr.line.zero td{color:var(--ink3)}
tr.line.zero td.tot{color:transparent}
tr.line:not(.zero) td.name{font-weight:600}
td.unit{color:var(--ink3);font-size:13px;width:70px}
td.pu{width:110px}
td.tot{width:120px;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.qty{width:170px}
.qwrap{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.qin{width:86px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:4px 7px}
.qin:focus{border-color:var(--focus);outline:none}
.qin.is-auto{border-color:color-mix(in srgb,var(--auto) 45%,var(--line));color:var(--auto)}
.qin.is-over{border-color:var(--ink3);font-weight:500}
.chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 5px;border-radius:3px;white-space:nowrap}
.chip.auto{color:var(--auto);background:color-mix(in srgb,var(--auto) 13%,transparent)}
.chip.man{color:var(--ink2);background:var(--panel2)}
.reset{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px}
.reset:hover{color:var(--ink);background:var(--panel2)}
.pchg{color:var(--warn);font-size:11px;margin-left:4px}
.dvt{display:block;margin-top:4px;field-sizing:content;min-height:2.2em;font-size:13px;color:var(--ink2);resize:vertical;line-height:1.35}
.xin.r{text-align:right}
.pbreak{border-top:2px dashed var(--ink3);text-align:center;color:var(--ink3);font-size:12px;padding:5px 0 2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dimg{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:4px 0}
.dimg img{max-width:160px;max-height:120px;border:1px solid var(--line);border-radius:4px;background:#fff}
.dimg-f{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
.xin{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
.sec-f{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* summary */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:980px){.summary{position:static}}
.sm-h{padding:14px 16px 4px}
.sm-h h2{font-size:17px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.srow .lbl{display:flex;align-items:center;gap:8px;font-weight:600}
.srow .lbl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.srow .cost{font-size:12px;color:var(--ink3);grid-column:1}
.srow .coef{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:12px;color:var(--ink3)}
.srow .coef input{width:56px;text-align:right;font-family:var(--mono);background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.srow .pv{font-family:var(--mono);font-size:15px;text-align:right}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 16px 2px;background:var(--panel2)}
.bar span{display:block;height:100%}
.bar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin:0 16px 8px}
.total{padding:14px 16px;background:var(--accent-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.total .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600}
.total .v{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.total .m{font-size:13px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:6px 10px;padding:12px 16px;font-size:14px;align-items:center}
.kv .k{color:var(--ink2)}
.kv .v{text-align:right;font-family:var(--mono)}
.hgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.htbl{min-width:700px}.htbl td{padding:7px 10px}.htbl td.num,.htbl th{white-space:nowrap}
.hres{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.hres>div{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.hres .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:600}
.hres b{font-size:19px;font-weight:500}.hres small{font-size:12px;color:var(--ink2)}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.alert{padding:8px 12px;border-radius:6px;font-size:13.5px;border-left:4px solid}
.alert b{margin-right:6px}
.alert.bad{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border-color:var(--warn)}
.alert.warn{background:var(--forage-soft);border-color:var(--forage)}
.alert.ok{background:var(--loc-soft);border-color:var(--loc)}
.banner.bad{background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.hres .hwarn.hok{background:var(--loc-soft)}
.hres .hwarn{grid-column:1/-1;background:var(--forage-soft);color:var(--ink);font-size:13px}
.warnc{color:var(--forage)}
.kv .objline{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;margin-top:-2px}
.kv .unit-in{width:120px;justify-self:end}
.kv .unit-in input{padding-right:34px}
.kv input,.kv select{width:120px;text-align:right;font-family:var(--mono);background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:5px 7px}
.kv .strong{font-weight:600;color:var(--ink)}
.good{color:var(--auto)} .bad{color:var(--warn)}
.note{font-size:12px;color:var(--ink3);padding:0 16px 14px}

/* list */
.list-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.list-tools input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
table.list{min-width:720px}
table.list td{padding:10px}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--panel2)}
.empty{padding:40px 16px;text-align:center;color:var(--ink3)}

/* tarifs */
.tar td{padding:3px 6px}
.tar input{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px}
.tar input:hover{border-color:var(--line)}
.tar input:focus{border-color:var(--focus);background:var(--ground);outline:none}
.tar input.pr{text-align:right;font-family:var(--mono)}
.tar input.rl{font-family:var(--mono);font-size:13px}
.tar input.rl.err{border-color:var(--warn);color:var(--warn)}
.tar tr.tgrp td{padding:4px 6px}
.tar input.gname{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:14px;color:var(--ink);max-width:420px}
.tar select.kd{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 4px;font-size:13px}
.tar select.kd:hover,.tar select.kd:focus{border-color:var(--line)}
.tar td.ev{font-family:var(--mono);font-size:12px;color:var(--ink3);text-align:right;width:70px}
.help{font-size:13px;color:var(--ink2);line-height:1.55}
.help code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:3px}

.banner{padding:10px 14px;border-radius:8px;background:var(--forage-soft);color:var(--ink);font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}

.who{max-width:1320px;margin:6px auto 0;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.login{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login-logo{height:70px;width:auto;align-self:flex-start;background:#fff;border-radius:8px;padding:4px 6px}
.login-card h2{font-size:22px}.login-card .btn{justify-content:center;padding:10px}
#login-err{margin:0;min-height:1em;font-size:13px}
</style>

<script>
const DATA = {"catalog": []};
const SECS=[
  {id:'racc',label:'Raccordement',sub:'Collecteur, PE, raccords, vannes, glycol, terrassement'},
  {id:'forage',label:'Forage',sub:'Sondes, cimentation, carburant, équipe'},
  {id:'loc',label:'Déplacements & sous-traitance',sub:'Hébergement, trajets, TRT'}
];
const DEF_COEF={racc:1.6,forage:2,loc:1.3};
const clone=o=>JSON.parse(JSON.stringify(o));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtE=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtE0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtN=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const eur=v=>fmtE.format(v||0), eur0=v=>fmtE0.format(v||0), nf=v=>fmtN.format(v||0);
const pnum=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- formula engine ---------- */
const FN={ceil:Math.ceil,floor:Math.floor,round:Math.round,max:Math.max,min:Math.min};
const VARS=['N','P','M','L','J','E','D1','D2','LF','LC','T','JR','VR','GLY','ZO'];
const ruleCache=new Map();
function compile(rule){
  if(ruleCache.has(rule))return ruleCache.get(rule);
  let f=null;
  const src=rule.replace(/(\d),(\d)/g,'$1.$2');
  const toks=src.match(/\s+|[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|&&|\|\||[<>=!]=|[-+*/()<>?:,!]/g)||[];
  if(toks.join('')===src && toks.every(t=>!/^[A-Za-z_]/.test(t)||VARS.includes(t)||FN[t])){
    try{f=new Function('ceil','floor','round','max','min',...VARS,'return ('+src+');')}catch(e){f=null}
  }
  ruleCache.set(rule,f);return f;
}
function evalRule(rule,v){
  if(!rule||!rule.trim())return null;
  const f=compile(rule.trim()); if(!f)return NaN;
  try{const r=Number(f(FN.ceil,FN.floor,FN.round,FN.max,FN.min,...VARS.map(k=>v[k])));return isFinite(r)?Math.round(r*100)/100:NaN}catch(e){return NaN}
}

/* ---------- state ---------- */
let catalog=migrateCat(clone(DATA.catalog));
let quote=null;
let savedList=[];
let db=null, dlApi=null, canWrite=true, catFromDb=false;
let dirty=false, view='devis', usedOnly=false, catDraft=null, listFilter='';

function blankQuote(){
  return {id:null,nom:'',lieu:'',client:'',tel:'',mail:'',archi:'',interlocuteur:'',chiffreur:'Fred',
    date:new Date().toISOString().slice(0,10),N:1,P:100,L:20,D2:0,mpj:100,jr:2,com:0,ffm:20,obj:80,h:{wpm:null,dT:3,conc:30,sing:30,pac:0,model:'',qPac:null,dispo:null},E:10,D1:0,coef:{...DEF_COEF},q:{},snap:{},extra:[],prixRetenu:null,tva:20,notes:'',updated:0,dvs:null};
}
function normQuote(q){const b=blankQuote();const o=Object.assign(b,clone(q));o.h=Object.assign(blankQuote().h,o.h||{});o.coef=Object.assign({...DEF_COEF},o.coef||{});o.q=o.q||{};o.snap=o.snap||{};o.extra=o.extra||[];return o}

function baseVars(){const N=+quote.N||0,P=+quote.P||0,L=+quote.L||0,mpj=+quote.mpj||100,E=+quote.E||0,D1=+quote.D1||0,D2=+quote.D2||0;const M=N*P;
  /* forages alignés tous les E m, chacun relié en direct au collecteur (aller + retour) : forage k à k×E → 2·k·E */
  /* collecteur au bout de la ligne, ou au milieu : deux demi-lignes de part et d'autre */
  const mid=quote.coll==='milieu',n1=mid?Math.ceil(N/2):N,n2=mid?Math.floor(N/2):0;
  const LF=E*(n1*(n1+1)+n2*(n2+1)),LC=2*L,DF=n1*E;
  /* tranchée : ligne des forages + collecteur → chaufferie */
  const T=E*N+L;
  return {N,P,L,M,J:mpj>0?Math.ceil(M/mpj):0,E,D1,D2,LF,LC,T,JR:+quote.jr||0,ZO:quote.zone==='orange'?1:0,DF}}
/* Glycol : ancienne règle forfaitaire (M+L)/25*20 remplacée par le volume réel du réseau */
function migrateCat(items){(items||[]).forEach(i=>{if(i&&i.id==='glycol'&&String(i.rule||'').replace(/\s/g,'')==='(M+L)/25*20')i.rule='GLY';if(i&&i.id==='glycol'&&i.name==='Glycol')i.name='Glycol pur'});if(Array.isArray(items)&&items.some(i=>i&&i.id==='trt')&&!items.some(i=>i&&i.id==='decl')){const k=items.findIndex(i=>i.id==='trt');items.splice(k,0,{id:'decl',sec:'loc',grp:'Administratif',name:'Déclarations (BRGM, DICT, rapport de fin de travaux)',unit:'forfait',price:0,qty:1,rule:'',kind:'frais'})}
  if(Array.isArray(items)&&items.some(i=>i&&i.id==='trt')&&!items.some(i=>i&&i.id==='zo')){const k=items.findIndex(i=>i.id==='trt');items.splice(k+1,0,{id:'zo',sec:'loc',grp:'Sous-traitance',name:'Déclaration zone orange (avis d’expert agréé)',unit:'forfait',price:0,rule:'ZO',kind:'st',poste:'zoneorange'})}

  /* barre PE Ø110 (diamètre courant) : ajoutée sans prix, à renseigner dans Tarifs */
  if(Array.isArray(items)&&items.some(i=>i&&i.id==='b125')&&!items.some(i=>i&&/[øØ]\s*110\b/.test(i.name||'')&&/\bPE\b/i.test(i.grp||''))){const k=items.findIndex(i=>i.id==='b125');const r=items[k];items.splice(k,0,{id:'b110',sec:r.sec||'racc',grp:r.grp||'Barre de PE',name:'Ø110',unit:r.unit||'ml',price:0,rule:'D2==110?LC:0',kind:'mat'})}
  return items}
function vars(){const v=baseVars();v.D1auto=!v.D1;if(!v.D1)v.D1=v.P>150?50:40;v.D2auto=!v.D2;if(!v.D2)v.D2=autoD2(v).D;const vr=volumeReseau(v);v.VR=Math.ceil(vr.tot);v.GLY=Math.ceil(vr.gly);return v}
/* Ø collecteur → chaufferie choisi selon le débit : vitesse ≤ 1 m/s, perte ≤ 150 Pa/m,
   et si la pression disponible de la PAC est connue, réseau ≤ 90 % de celle-ci */
/* Diamètres PE proposés : liste de base + tout « ØNNN » trouvé dans les catégories PE des Tarifs */
const BASE_D=[32,40,50,63,75,90,110,125];
/* perte maxi admise sur la liaison collecteur → chaufferie (aller + retour), en kPa : au-delà, on monte d'un diamètre ; c'est ce qui fait grossir le tube quand la liaison s'allonge */
const SEG_MAX=15;
function peDiams(){const s=new Set(BASE_D);(catalog||[]).forEach(i=>{if(/\bPE\b/i.test(i.grp||'')){const m=/[øØ]\s*(\d{2,3})\b/.exec(i.name||'');if(m)s.add(+m[1])}});return [...s].sort((a,b)=>a-b)}
function d2List(){return peDiams().filter(D=>D>=40)}
function autoD2(v){
  const D2_LIST=d2List();const rs=D2_LIST.map(D=>{const r=hydroFor({...v,D2:D});const sg=r.segs[2];return {D,r,hyd:sg.v<=1.0&&(sg.L?sg.dp*1000/sg.L:0)<=150&&sg.dp<=SEG_MAX}});
  const dispo=rs[0].r.dispo;
  const pass=[x=>x.hyd&&(!(dispo>0)||x.r.reseau<=0.9*dispo), x=>x.hyd&&x.r.reseau<=dispo, x=>x.hyd];
  for(const f of pass){const x=rs.find(f);if(x)return {D:x.D}}
  return {D:D2_LIST[D2_LIST.length-1]}}
const KINDS=[['mat','Matière'],['loc','Location / engin'],['mo','Main-d’œuvre'],['dep','Déplacement / hébergement'],['st','Sous-traitance'],['frais','Frais divers']];
const KIND_ID={mo_r:'mo',cim:'mo',mo_f:'mo',mp_c:'loc',manu:'loc',heb:'dep',dep:'dep',tpl:'dep',tvl:'dep',trt:'st',ach:'frais',l_grav:'frais'};
function kindOf(l){if(l.kind)return l.kind;if(KIND_ID[l.id])return KIND_ID[l.id];const c=catalog.find(i=>i.id===l.id);if(c?.kind)return c.kind;
  if(/^l_/.test(l.id)||/location/i.test(l.grp||''))return 'loc';if(/main-d|hébergement|trajet/i.test(l.grp||''))return 'mo';return 'mat'}
function lines(){
  const out=[];const ids=new Set();
  for(const it of catalog){ids.add(it.id);const s=quote.snap[it.id];out.push({...it,price:s?s.price:it.price,catPrice:it.price,src:'cat'})}
  for(const [id,s] of Object.entries(quote.snap)){if(!ids.has(id)&&!id.startsWith('x_'))out.push({id,...s,rule:'',src:'old'})}
  for(const x of quote.extra)out.push({...x,src:'extra'});
  return out;
}
function autoQty(l,v){if(l.src!=='cat')return null;if(l.rule&&l.rule.trim())return evalRule(l.rule,v);const d=+l.qty;return d>0?d:null}
function qtyOf(l,v){
  if(l.src==='extra')return +l.qty||0;
  if(Object.prototype.hasOwnProperty.call(quote.q,l.id))return +quote.q[l.id]||0;
  const a=autoQty(l,v);return isFinite(a)&&a!=null?a:0;

function totals(){
  const v=vars();const cost={racc:0,forage:0,loc:0};

  const pv={};let tc=0,tp=0;for(const s of SECS){cost[s.id]=Math.round(cost[s.id]*100)/100;pv[s.id]=(cost[s.id]-stc[s.id])*(+quote.coef[s.id]||0)+stc[s.id]*(1+stMarge()/100);tc+=cost[s.id];tp+=pv[s.id]}
  return {v,cost,pv,tc,tp};
}

/* PE100 SDR11 : épaisseur de paroi (mm) par diamètre extérieur */
const PE_E={32:2.9,40:3.7,50:4.6,63:5.8,75:6.8,90:8.2,110:10,125:11.4,140:12.7,160:14.6,180:16.4,200:18.2,225:20.5,250:22.7};
/* Monopropylène glycol vers 0 °C (valeurs approchées) : % volume, viscosité mPa·s, masse vol. kg/m³, cp kJ/kg·K */
const MPG=[[0,1.79,1000,4.21],[10,2.4,1008,4.13],[20,3.4,1017,4.02],[25,4.2,1021,3.96],[30,5.2,1026,3.88],[35,6.4,1030,3.80],[40,8.0,1034,3.71],[50,12.5,1042,3.55]];
function fluid(c){c=Math.max(0,Math.min(50,+c||0));let i=0;while(i<MPG.length-2&&c>MPG[i+1][0])i++;const a=MPG[i],b=MPG[i+1],k=(c-a[0])/(b[0]-a[0]);const f=j=>a[j]+(b[j]-a[j])*k;return {mu:f(1)/1000,rho:f(2),cp:f(3)}}
function friction(Re,Dm){const eps=0.00001;if(Re<=0)return 0;if(Re<2300)return 64/Re;
  const turb=r=>0.25/Math.pow(Math.log10(eps/(3.7*Dm)+5.74/Math.pow(r,0.9)),2);
  if(Re<4000){const k=(Re-2300)/1700;return 64/2300*(1-k)+turb(4000)*k}return turb(Re)}
function segment(name,D,L,Qm3h,fl,note){const DI=(D-2*(PE_E[D]||D/11))/1000;const A=Math.PI*DI*DI/4;const v=Qm3h/3600/A;
  const Re=v*DI*fl.rho/fl.mu;const f=friction(Re,DI);const dp=f*(L/DI)*fl.rho*v*v/2/1000;return {name,D,DI:DI*1000,L,Q:Qm3h,v,Re,dp,note}}
function hydro(){return hydroFor(vars())}
function hydroFor(v){
  const h=quote.h,fl=fluid(concGly());const N=Math.max(1,v.N);
  const wpm=h.wpm!=null&&h.wpm!==''?+h.wpm:45;const kwAuto=Math.round(v.M*wpm/100)/10;const kw=kwAuto;const dT=+h.dT||3;
  const qCalc=kw/(fl.rho*fl.cp*dT)*3600; /* m³/h */
  const Q=+h.qPac>0?+h.qPac:qCalc;
  const Ds=v.P>150?40:32;
  const segs=[
    segment('Sonde (une boucle du double U)',Ds,2*v.P,Q/(2*N),fl,`${nf(v.P)} m × 2 (descente + remontée) · Ø${Ds}`),
    segment('Forage le plus éloigné → collecteur',v.D1||40,2*v.DF,Q/N,fl,`${nf(v.DF)} m × 2 (aller + retour) · collecteur ${quote.coll==='milieu'?'au milieu':'au bout'}${v.D1auto?' · Ø selon profondeur':''}`),
    segment('Collecteur → chaufferie',v.D2||63,2*v.L,Q,fl,`${nf(v.L)} m × 2 (aller + retour)${v.D2auto?' · Ø choisi selon le débit':''}`)];
  const lin=segs.reduce((a,s)=>a+s.dp,0),sing=lin*(+h.sing||0)/100,pac=+h.pac||0,tot=lin+sing+pac;
  const reseau=lin+sing,dispo=+h.dispo||0;
  const verdict=dispo>0?(dispo>=reseau?{ok:true,txt:`Le circulateur de la PAC suffit : ${nf(dispo)} kPa disponibles pour ${nf(reseau)} kPa de réseau (marge ${nf(dispo-reseau)} kPa).`}
    :{ok:false,txt:`Circulateur de la PAC insuffisant : il manque ${nf(reseau-dispo)} kPa (${nf((reseau-dispo)*1000/(fl.rho*9.81))} mCE). Prévoir un circulateur complémentaire ou augmenter les diamètres.`}):null;
  return {kw,kwAuto,wpm,qCalc,Q,fl,segs,lin,sing,pac,tot,reseau,dispo,verdict,mce:tot*1000/(fl.rho*9.81)}
}

const LIM={vMax:1.0,vBranch:1.2,vMin:0.15,paMain:150,paBranch:250,loopKpa:40};
function fitD(list,L,Q,fl,paMax){for(const D of list){const g=segment('',D,L||1,Q,fl);if(g.v<=LIM.vMax&&g.dp*1000/(L||1)<=paMax&&g.dp<=SEG_MAX)return D}return null}
function sizingAlerts(v,r){
  const A=[];const [so,br,mn]=r.segs;const pam=g=>g.L?g.dp*1000/g.L:0;
  if(so.Re<2300)A.push({lvl:'warn',seg:0,txt:`Sondes : écoulement laminaire (Re ${Math.round(so.Re)}). Échange thermique réduit : augmenter le débit ou réduire le glycol.`});
  if(so.v>LIM.vMax)A.push({lvl:'bad',seg:0,txt:`Sondes Ø${so.D} : vitesse ${nf(so.v)} m/s trop élevée pour le débit par boucle.`});
  if(so.dp>LIM.loopKpa)A.push({lvl:'warn',seg:0,txt:`Sondes : ${nf(so.dp)} kPa par boucle, perte élevée (profondeur ou débit important).`});
  const d1Rule=v.P>150?50:40;
  if(!v.D1auto&&v.D1!==d1Rule)A.push({lvl:'warn',seg:1,txt:`Liaisons forages → collecteur en Ø${v.D1} : la règle est Ø${d1Rule} pour ${nf(v.P)} m de profondeur.`});
  /* liaisons forages → collecteur : on suit la pratique Hydreau (sonde Ø32 → liaison Ø40, sonde Ø40 → liaison Ø50) ; alerte seulement si la vitesse devient vraiment excessive */
  if(br.L&&br.v>LIM.vBranch)A.push({lvl:'warn',seg:1,txt:`Liaisons forages → collecteur Ø${br.D} : vitesse élevée (${nf(br.v)} m/s, ${Math.round(pam(br))} Pa/m) pour ce débit par forage.`})
  else if(br.L&&br.v<LIM.vMin)A.push({lvl:'warn',seg:1,txt:`Liaisons forages → collecteur Ø${br.D} surdimensionnées (${nf(br.v)} m/s) : un diamètre plus petit suffit.`});
  if(mn.L&&(mn.v>LIM.vMax||pam(mn)>LIM.paMain||mn.dp>SEG_MAX)){const s=fitD(d2List().filter(D=>D>mn.D),mn.L,mn.Q,r.fl,LIM.paMain);
    A.push({lvl:'bad',seg:2,txt:`Collecteur → chaufferie Ø${mn.D} sous-dimensionné (${nf(mn.v)} m/s, ${Math.round(pam(mn))} Pa/m, ${nf(mn.dp)} kPa sur ${nf(mn.L)} m).${s?` Passer en Ø${s}.`:''}${v.D2auto?'':' (diamètre choisi à la main : mettre « Auto (selon débit) » pour qu’il suive le débit)'}`})}

  const pe=(D,len)=>{if(!(len>0))return;const it=catalog.filter(i=>/\bPE\b/i.test(i.grp||'')&&new RegExp('[øØ]\\s*'+D+'\\b').test(i.name||'')&&String(i.rule||'').includes(String(D)));
    if(!it.length)A.push({lvl:'bad',seg:-1,txt:`PE Ø${D} : aucun article avec règle dans les Tarifs, les ${nf(len)} m ne sont pas chiffrés.`});
    else if(!it.some(i=>+i.price>0))A.push({lvl:'bad',seg:-1,txt:`PE Ø${D} : prix à 0 € dans les Tarifs (${nf(len)} m non chiffrés). Renseigner le prix.`})};
  if(v.D1===v.D2)pe(v.D1,v.LF+v.LC);else{pe(v.D1,v.LF);pe(v.D2,v.LC)}
  return A}

function coupeSVG(){
  const v=vars();const n=Math.max(0,Math.min(v.N,12));const W=320,H=150,g=26;
  const maxD=Math.max(v.P,100);const depth=Math.max(8,(H-g-18)*(v.P/maxD));
  const x0=70, span=W-x0-18; const step=n>1?span/(n-1):0;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Coupe : ${v.N} forages de ${v.P} m"><rect x="0" y="${g}" width="${W}" height="${H-g}" fill="var(--forage-soft)"/>`;

  s+=`<rect x="18" y="${g-14}" width="26" height="12" rx="2" fill="var(--racc)"/><text x="31" y="${g-18}" text-anchor="middle" font-size="9" fill="var(--ink2)" font-family="Barlow,sans-serif">collecteur</text>`;
  const xs=[];for(let i=0;i<n;i++)xs.push(n>1?x0+i*step:x0+span/2);
  if(n>0)s+=`<line x1="44" x2="${xs[xs.length-1]}" y1="${g+5}" y2="${g+5}" stroke="var(--racc)" stroke-width="2"/>`;
  for(const x of xs)s+=`<line x1="${x}" x2="${x}" y1="${g+5}" y2="${g+depth}" stroke="var(--forage)" stroke-width="3" stroke-linecap="round"/>`;
  if(n>1)s+=`<text x="${(xs[0]+xs[1])/2}" y="${g+18}" text-anchor="middle" font-size="10" fill="var(--ink2)" font-family="IBM Plex Mono,monospace">${nf(v.E)} m</text>`;

}

/* sous-traitance (TRT, zone orange…) : hors production, ajoutée par-dessus l'objectif au mètre */
function isST(l){return l.src!=='extra'&&kindOf(l)==='st'}
function stMarge(){return quote.stm!=null&&quote.stm!==''?+quote.stm:15}
function stVente(t){t=t||totals();const v=t.v;let s=0;for(const l of lines()){if(!isST(l))continue;const q=qtyOf(l,v);if(q>0)s+=q*(+l.price||0)*(1+stMarge()/100)}return r2(s)}
/* coefficient appliqué à la production (hors sous-traitance) pour tomber sur le prix retenu */
function kProd(t){t=t||totals();const stV=stVente(t),pe=prixEff(t);return t.tp-stV>0.005?(pe-stV)/(t.tp-stV):1}
function unitVente(l,k){return isST(l)?(+l.price||0)*(1+stMarge()/100):(+l.price||0)*(+quote.coef[l.sec]||0)*k}
function objPrix(t){t=t||totals();const b=Math.round((+quote.obj||0)*t.v.M);return b>0?r2(b+stVente(t)):0}
function prixEff(t){const pObj=objPrix(t);return quote.prixRetenu!=null?+quote.prixRetenu:(pObj||t.tp)}
function updateSummary(t){
  t=t||totals();
  for(const s of SECS){
    document.querySelectorAll(`[data-cost="${s.id}"],[data-cost2="${s.id}"]`).forEach(e=>e.textContent=eur(t.cost[s.id]));
    const p=$(`[data-pv="${s.id}"]`);if(p)p.textContent=eur(t.pv[s.id]);
  }
  const bar=$('.bar');if(bar)bar.innerHTML=SECS.map(s=>`<span style="width:${t.tp?100*t.pv[s.id]/t.tp:0}%;background:var(--${s.id})"></span>`).join('');
  $('#s-total').textContent=eur(t.tp);$('#s-perm').textContent=t.v.M?eur(t.tp/t.v.M):'–';$('#s-cost').textContent=eur(t.tc);
  const pObj=objPrix(t),stv=stVente(t);
  const pr=quote.prixRetenu!=null?+quote.prixRetenu:(pObj||t.tp);
  const pi=$('#q-prix');if(pi)pi.placeholder=pObj?fmtN.format(pObj):'= calculé';
  const pn=$('#s-prixnote');if(pn)pn.textContent=quote.prixRetenu!=null?'Prix saisi à la main — videz la case pour revenir à l’objectif':pObj?`Prix retenu = ${nf(+quote.obj)} €/m × ${nf(t.v.M)} m${stv?' + sous-traitance '+eur(stv):''}`:'Prix retenu = prix calculé';
  const ec=pr-t.tp;const e=$('#s-ecart');e.textContent=Math.abs(ec)>0.005?(ec>=0?'+':'')+eur(ec):'–';e.className='v '+(Math.abs(ec)<=0.005?'':ec>=0?'good':'bad');
  const mg=pr-t.tc;$('#s-marge').textContent=`${eur(mg)} · ${pr?nf(100*mg/pr):0} %`;
  $('#s-ttc').textContent=eur(pr*(1+(+quote.tva||0)/100));
  const po=pObj, so=$('#s-obj');
  so.textContent=po?eur(po):'–';
  const sp=$('#s-objpct');sp.textContent=po?(t.tp<po?`Calcul ${nf(100*(po-t.tp)/po)} % sous l'objectif`:`Calcul ${nf(100*(t.tp-po)/po)} % au-dessus`):'';sp.className=po&&t.tp<po?'bad':'good';
  const com=pr*(+quote.com||0)/100, ff=(+quote.ffm||0)*t.v.M, net=mg-com-ff;
  $('#s-ded').textContent='− '+eur(com+ff);
  const ne=$('#s-net');ne.textContent=`${eur(net)} · ${pr?nf(100*net/pr):0} %`;ne.className='v strong '+(net>=0?'good':'bad');
  const d=vars();$('#d-M').textContent=nf(d.M)+' m';$('#d-J').textContent=d.J+' j';$('#d-ML').textContent=nf(d.M+d.L)+' m';$('#d-T').textContent=nf(d.T)+' m';$('#d-LF').textContent=`${nf(d.LF)} m Ø${d.D1}${d.D1auto?' (auto)':''}`;$('#d-LC').textContent=`${nf(d.LC)} m Ø${d.D2}${d.D2auto?' (auto)':''}`;
  const c=$('#coupe');if(c)c.innerHTML=coupeSVG();
  updateHydro();
}

function refreshLines(){
  const v=vars();const map=new Map(lines().map(l=>[l.id,l]));let needRender=false;
  document.querySelectorAll('tr.line').forEach(tr=>{
    const l=map.get(tr.dataset.id);if(!l)return;const q=qtyOf(l,v);
    if(usedOnly&&!q&&l.src!=='extra')needRender=true;
    tr.classList.toggle('zero',!q);tr.querySelector('td.tot').textContent=eur(q*(+l.price||0));
    const inp=tr.querySelector('[data-q]');
    if(inp&&document.activeElement!==inp&&!Object.prototype.hasOwnProperty.call(quote.q,l.id)){const a=autoQty(l,v);inp.value=a?nf(a).replace(/\s/g,''):''}
  });
  if(usedOnly){const shown=document.querySelectorAll('tr.line').length;const want=lines().filter(l=>qtyOf(l,v)||l.src==='extra').length;if(shown!==want)needRender=true}
  if(needRender&&!document.activeElement?.closest('table'))renderDevis();
  updateSummary();
}

function onDevisInput(e){
  const tg=e.target;

    if(k==='nom')$('.toolbar .title').textContent=quote.nom||'Nouveau chiffrage';
    if(tg.dataset.n||k==='zone'||k==='coll')refreshLines();return}

    tg.classList.add('is-over');tg.classList.remove('is-auto');refreshLines();return}
  if(tg.dataset.x){const id=tg.closest('tr').dataset.id;const x=quote.extra.find(o=>o.id===id);if(!x)return;
    x[tg.dataset.x]=(tg.dataset.x==='qty'||tg.dataset.x==='price')?(pnum(tg.value)??0):tg.value;markDirty();refreshLines();return}
  if(tg.dataset.coef){const n=pnum(tg.value);quote.coef[tg.dataset.coef]=n??0;markDirty();updateSummary();return}

async function exportCSV(){
  const t=totals();const v=t.v;const n=x=>String(Math.round(x*100)/100).replace('.',',');const c=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const r=[['Chantier',quote.nom],['Lieu',quote.lieu],['Client',quote.client],['Date',quote.date],['Forages',`${v.N} × ${v.P} m`],['Liaison (m)',v.L],[],['Section','Groupe','Désignation','Unité','Quantité','PU HT','Total HT']];
  for(const s of SECS){for(const l of lines().filter(l=>l.sec===s.id)){const q=qtyOf(l,v);if(q)r.push([s.label,l.grp||'Lignes libres',l.name,l.unit,n(q),n(+l.price),n(q*l.price)])}

Article 1 – Objet
1.1 – Les présentes conditions s'appliquent aux travaux de forage (géothermie, eau), de pose de sondes géothermiques, de raccordement et de pompage réalisés par Hydreau Forage. La signature du devis vaut acceptation des présentes conditions.
1.2 – Le devis est établi gratuitement. Il est valable pendant la durée indiquée ; au-delà, les prix peuvent être révisés.

Article 2 – Le forage
2.1 – Le choix du lieu d'implantation du forage relève de la seule responsabilité du client, après vérification des conditions réglementaires qui lui sont applicables.
2.2 – Les dégradations éventuelles pour accéder à l'aire de foration ne peuvent être imputées à Hydreau Forage.
2.3 – La fourniture d'eau et d'électricité nécessaire au chantier reste à la charge du client.
2.4 – Sauf mention contraire au devis, la remise en état du site après travaux est à la charge du client, qui assume également les conséquences directes ou indirectes de l'écoulement des rejets du forage.
2.5 – Si, lors de la foration, le débit du forage s'avère inexploitable ou s'il est impossible de mettre en œuvre les tubes de forage ou les sondes géothermiques, le forage sera facturé en sondage.
2.6 – Le client communique avant le démarrage les plans des réseaux enterrés dont il a connaissance. Hydreau Forage ne peut être tenu responsable de la casse de réseaux non repérés.

Article 3 – Débit des forages d'eau et pompage
3.1 – Hydreau Forage garantit au client le débit du forage à condition que l'installation de pompage soit réalisée par Hydreau Forage ou l'un de ses partenaires, et que le débit de pompage ne dépasse pas 70 % de la capacité du forage suivant les recommandations du foreur. Cette garantie est valable un an à compter de la date de facture.
3.2 – Sont exclus de la garantie : la diminution ou l'arrêt du débit dus à un séisme, un mouvement de terrain, un fait de guerre et plus généralement tout cas de force majeure ; en géothermie avec prélèvement et rejet d'eau, la saturation du forage de rejet et son débordement ; la potabilité et la qualité de l'eau (fer, sable, nitrates, bactéries…) ; le colmatage du forage dû à un excès de fer ou de sédiments.
3.3 – Les fournitures (pompes, matériels) sont garanties un an à compter de leur livraison, pour un usage normal, après examen de la pièce défectueuse retournée franco de port.

Article 4 – Sondes géothermiques
4.1 – Les travaux de forage et de pose des sondes géothermiques relèvent de la responsabilité décennale d'Hydreau Forage (articles 1792 et suivants du Code civil), dans des conditions normales d'utilisation.
4.2 – La longueur totale de sondes est déterminée par le fabricant ou l'installateur de la pompe à chaleur, ou par le bureau d'études. Hydreau Forage ne peut être tenu responsable d'une erreur de détermination de cette longueur.

Article 5 – Prix, facturation et paiement
5.1 – Les prix sont établis en euros hors taxes, départ Tréglamus ou Laillé, montage non compris sauf mention contraire. La TVA est celle en vigueur à la date de facturation ; un taux réduit n'est appliqué que sur remise par le client de l'attestation requise.
5.2 – Toute prestation non prévue au devis fait l'objet d'un avenant ou d'un devis complémentaire accepté par le client. La facturation tient compte des quantités réellement mises en œuvre (mètres forés, longueurs posées) et du temps réellement passé pour les prestations en régie.
5.3 – Sauf conditions particulières du devis, les factures sont payables à réception, sans escompte pour paiement anticipé.

  return `<tr data-i="${i}"><td><input class="xin" data-lf="name" value="${esc(l.name)}" placeholder="Désignation" style="font-weight:600"><textarea class="xin dvt" data-lf="desc" rows="${Math.max(1,String(l.desc||'').split('\n').length)}" placeholder="Détail (une ligne par tiret)">${esc(l.desc||'')}</textarea></td>
    <td style="width:90px"><input class="xin r num" data-lf="q" inputmode="decimal" value="${esc(String(l.q??'').replace('.',','))}"></td>
    <td style="width:80px"><input class="xin" data-lf="unit" value="${esc(l.unit||'')}"></td>
    <td style="width:110px"><input class="xin r num" data-lf="pu" inputmode="decimal" value="${esc(String(l.pu??'').replace('.',','))}"></td>
    <td style="width:120px">${tvaSel(l.tva,'class="xin" data-lf="tva"')}</td>

function dvpTotalsHTML(){const d=quote.dvs;const T=devisTotaux(dvsItems(d));const pe=r2(prixEff(totals()));const ec=r2(T.ht-pe);
  return `<div class="kv" style="max-width:520px;margin-left:auto">
    <span class="k">Total HT</span><span class="v strong">${eur(T.ht)}</span>
    ${T.rates.map(o=>`<span class="k">TVA ${o.r?nf(o.r)+' %':'0 % (autoliquidation)'}</span><span class="v">${eur(o.tva)}</span>`).join('')}
    <span class="k strong">Total TTC</span><span class="v strong">${eur(T.ttc)}</span>
    <span class="k">Prix retenu dans le chiffrage</span><span class="v">${eur(pe)}</span>
    <span class="k">Écart devis / chiffrage</span><span class="v ${Math.abs(ec)<0.01?'':ec>0?'good':'bad'}">${Math.abs(ec)<0.01?'aucun':(ec>0?'+':'')+eur(ec)}</span>
    <span class="k strong">Prix souhaité HT</span><span class="v"><input id="p-cible" inputmode="decimal" value="${esc(String(d.cible??dvpObjectif()).replace('.',','))}" aria-label="Prix souhaité HT"></span>
    <span class="k" style="font-size:12px">Par défaut : objectif ${nf(+quote.obj||0)} €/m × ${nf(totals().v.M)} m forés${stVente()?' + sous-traitance '+eur(stVente()):''}</span><span class="v" style="font-size:12px">${totals().v.M?nf(r2((d.cible??dvpObjectif())/totals().v.M))+' €/m':''}</span>
    <span class="k" style="font-size:12px">Les prix unitaires sont recalculés en proportion ; le prix retenu du chiffrage suit. TRT et zone orange ne bougent pas.</span><span class="v"><button class="btn sm primary" id="p-ajust">Ajuster le devis à ce prix</button></span></div>`}
const dvFixed=l=>l.src==='trt'||l.src==='zoneorange'||/réponse thermique|zone orange/i.test(l.name||'');
function dvpObjectif(){const t=totals();const o=objPrix(t);return o>0?o:r2(prixEff(t))}
function ajusterDevis(){const d=quote.dvs;if(!d)return;const target=r2(d.cible!=null?d.cible:dvpObjectif());
  const all=d.lines.filter(l=>l.type!=='sec'&&r2((+l.q||0)*(+l.pu||0))!==0);const fs=all.filter(dvFixed).reduce((s,l)=>s+r2((+l.q||0)*(+l.pu||0)),0);const ls=all.filter(l=>!dvFixed(l));const cur=ls.reduce((s,l)=>s+r2((+l.q||0)*(+l.pu||0)),0);
  if(!(target>0)||!(cur>0)){toast('Rien à ajuster : saisissez un prix et des lignes chiffrées');return}
  const k=(target-fs)/cur;if(!(k>0)){toast('Prix souhaité inférieur au montant de la sous-traitance');return}for(const l of ls)l.pu=r2((+l.pu||0)*k);
  const sum=ls.reduce((s,l)=>s+r2((+l.q||0)*(+l.pu||0)),0);const diff=r2(target-fs-sum);
  if(Math.abs(diff)>=0.01){const f=ls.filter(l=>+l.q===1&&+l.pu>0).sort((a,b)=>b.pu-a.pu)[0];if(f)f.pu=r2(+f.pu+diff)}
  const t0=totals(),isObj=Math.abs(target-objPrix(t0))<0.01;quote.prixRetenu=isObj?null:target;if(isObj)delete d.cible;else d.cible=target;dvpDirty();dvpRerender();toast('Devis ajusté à '+eur(target)+' HT')}
function renderDvp(){const el=$('#v-dvp');const d=quote.dvs;
  if(!d){el.innerHTML=`<div class="toolbar"><div class="title">Devis${quote.nom?' – '+esc(quote.nom):''}</div></div>
    <div class="card"><div class="empty">Pas encore de devis pour ce chiffrage.<br><br><button class="btn primary" id="p-create">Créer le devis à partir du chiffrage</button>
    <p class="help" style="max-width:560px;margin:14px auto 0">Le devis reprend les postes et les prix du chiffrage. Ensuite tout se modifie ici à la main : textes, quantités, prix, TVA, lignes et sections.</p></div></div>`;return}
  const pf=(k,l,type='text',wide)=>`<div class="f" ${wide?'style="grid-column:1/-1"':''}><label for="p-${k}">${l}</label><input id="p-${k}" type="${type}" data-p="${k}" value="${esc(d[k]??'')}"></div>`;
  const ta=(k,l,rows=2,wide=true)=>`<div class="f" style="grid-column:${wide?'1/-1':'span 2'}"><label for="p-${k}">${l}</label><textarea id="p-${k}" data-p="${k}" rows="${rows}">${esc(d[k]??'')}</textarea></div>`;
  el.innerHTML=`<div class="toolbar"><div class="title">Devis ${esc(d.numero||'')}</div><span class="status ${dirty?'dirty':''}" id="st2">${dirty?'Modifications non enregistrées':''}</span>
    <button class="btn ghost" id="p-regen">Recréer depuis le chiffrage</button><button class="btn" id="p-pdf">Devis PDF</button><button class="btn primary" id="p-save" ${db&&canWrite?'':'disabled'}>Enregistrer</button></div>
  ${(()=>{const mx=missingExtras();return mx.length?`<div class="banner">${mx.length} ligne${pl(mx.length)} libre${pl(mx.length)} du chiffrage pas encore dans le devis : <b>${mx.map(p=>esc(p.name)).join(', ')}</b> <button class="btn sm primary" id="p-addx">Les ajouter au devis</button></div>`:''})()}
  ${dvpConfirm?`<div class="banner">Remplacer toutes les lignes, l’objet et le délai par le calcul actuel du chiffrage ? Vos modifications de lignes seront perdues. <span class="confirm"><button class="btn sm danger" id="p-regen-ok">Remplacer</button><button class="btn sm ghost" id="p-regen-no">Annuler</button></span></div>`:''}
  <div class="card"><div class="card-h"><h2>En-tête</h2></div><div class="card-b"><div class="fields">
    ${pf('numero','N° de devis')}${pf('date','Date','date')}${pf('validite','Validité (jours)')}
    <div class="f"><label for="p-clientType">Type de client</label><select id="p-clientType" data-p="clientType"><option value="pro" ${d.clientType!=='part'?'selected':''}>Professionnel</option><option value="part" ${d.clientType==='part'?'selected':''}>Particulier</option></select></div>
    ${pf('client','Client (nom / raison sociale)')}${ta('clientAdr','Adresse de facturation',3,false)}${pf('clientTva','N° TVA client')}${pf('clientSiret','SIRET client')}${pf('tel','Téléphone')}${pf('mail','E-mail')}

  </div></div></div>

    <tbody id="p-body">${d.lines.map((l,i)=>dvpRow(l,i,d.lines.length)).join('')||'<tr><td colspan="7" class="empty">Aucune ligne</td></tr>'}</tbody></table></div>
    <div class="sec-f"><span style="display:flex;gap:8px"><button class="btn sm" id="p-addsec">+ Section</button><button class="btn sm" id="p-addline">+ Ligne</button><button class="btn sm" id="p-addimg">+ Image</button><button class="btn sm" id="p-addbrk">+ Saut de page</button></span></div>

function dvpDirty(){markDirty();const s=$('#st2');if(s){s.textContent='Modifications non enregistrées';s.className='status dirty'}}
function onDvpInput(e){const tg=e.target,d=quote.dvs;if(!d)return;
  if(tg.id==='p-cible'){d.cible=pnum(tg.value);dvpDirty();return}
  if(tg.dataset.p){d[tg.dataset.p]=tg.value;if(tg.dataset.p==='numero')$('#v-dvp .toolbar .title').textContent='Devis '+tg.value;dvpDirty();return}
  if(tg.dataset.lf){const tr=tg.closest('tr');const l=d.lines[+tr.dataset.i];if(!l)return;const f=tg.dataset.lf;
    l[f]=(f==='q'||f==='pu')?(pnum(tg.value)??0):(f==='tva'||f==='w')?+tg.value:tg.value;dvpDirty();
    if(f==='q'||f==='pu'||f==='tva'){const c=tr.querySelector('td.tot');if(c)c.textContent=eur(r2((+l.q||0)*(+l.pu||0)));$('#p-tot').innerHTML=dvpTotalsHTML()}}}
function dvpRerender(){const y=window.scrollY;renderDvp();window.scrollTo(0,y)}
async function onDvpClick(e){const b=e.target.closest('button');if(!b)return;const d=quote.dvs;
  if(b.id==='p-create'){quote.dvs=devisFromChiffrage();dvpDirty();renderDvp();return}
  if(b.id==='p-regen'){dvpConfirm=true;dvpRerender();return}
  if(b.id==='p-regen-no'){dvpConfirm=false;dvpRerender();return}
  if(b.id==='p-regen-ok'){dvpConfirm=false;quote.dvs=devisFromChiffrage();dvpDirty();dvpRerender();toast('Lignes recréées depuis le chiffrage');return}
  if(b.id==='p-pdf'){exportPDF('devis');return}
  if(b.id==='p-save'){await saveQuote();renderDvp();return}
  if(b.id==='p-ajust'){ajusterDevis();return}
  if(b.id==='p-addx'){addExtras();return}
  if(!d)return;const n=d.lines.length;
  if(b.id==='p-addsec'){d.lines.push({id:lid(),type:'sec',name:'Nouvelle section'});dvpDirty();dvpRerender();$(`#p-body tr[data-i="${n}"] input`)?.select();return}
  if(b.id==='p-addline'){d.lines.push({id:lid(),type:'line',name:'',desc:'',q:1,unit:'forfait',pu:0,tva:tvaDef()});dvpDirty();dvpRerender();$(`#p-body tr[data-i="${n}"] input`)?.focus();return}
  if(b.id==='p-addimg'){pickImg(n,true);return}
  if(b.id==='p-addbrk'){d.lines.push({id:lid(),type:'break'});dvpDirty();dvpRerender();return}
  if(b.dataset.insimg){pickImg(+b.dataset.insimg+1,true);return}
  if(b.dataset.insbrk){d.lines.splice(+b.dataset.insbrk+1,0,{id:lid(),type:'break'});dvpDirty();dvpRerender();return}
  if(b.dataset.imgpick){pickImg(+b.dataset.imgpick,false);return}
  if(b.dataset.imgsmall){shrinkImg(+b.dataset.imgsmall);return}
  const mv=(i,j)=>{const x=d.lines.splice(i,1)[0];d.lines.splice(j,0,x);dvpDirty();dvpRerender()};
  if(b.dataset.up){const i=+b.dataset.up;if(i>0)mv(i,i-1);return}
  if(b.dataset.down){const i=+b.dataset.down;if(i<n-1)mv(i,i+1);return}
  if(b.dataset.del){d.lines.splice(+b.dataset.del,1);dvpDirty();dvpRerender();return}
  if(b.dataset.ins){const i=+b.dataset.ins;d.lines.splice(i+1,0,{id:lid(),type:'line',name:'',desc:'',q:1,unit:'forfait',pu:0,tva:tvaDef()});dvpDirty();dvpRerender();$(`#p-body tr[data-i="${i+1}"] input`)?.focus();return}
}

let fsdb=null,fbUser=null;
function mapErr(e){return {code:e?.code==='permission-denied'?'invalid_argument':'unavailable',message:e?.message||''}}
function denied(e){if(e?.code==='permission-denied'){showLogin('Compte connecté mais non autorisé : ajoutez son e-mail dans la collection « acces » de Firestore.');}}
function makeDb(){return {
  doc(path){const r=fsdb.doc(path);return {
    set:o=>r.set(JSON.parse(JSON.stringify({...o,updated_by:fbUser?.email||null}))).catch(e=>{throw mapErr(e)}),
    delete:()=>r.delete().catch(e=>{throw mapErr(e)}),
    onSnapshot:(fn)=>r.onSnapshot(s=>fn({exists:s.exists,data:()=>s.data()}),denied)}},
  collection(p){let q=fsdb.collection(p);const api={orderBy(f,d){q=q.orderBy(f,d);return api},limit(n){q=q.limit(n);return api},
    onSnapshot(fn){return q.onSnapshot(s=>fn({docs:s.docs.map(d=>({data:()=>d.data()}))}),denied)}};return api}}}
dlApi={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return 'saved'}};
function showLogin(msg){$('#login').hidden=false;$('#login-err').textContent=msg||'';setTimeout(()=>$('#l-mail')?.focus(),50)}
let started=false;
function startSession(user){fbUser=user;$('#login').hidden=true;$('#who').textContent=user.email;$('#who-box').hidden=false;if(started)return;started=true;
  db=makeDb();if(view==='devis')renderDevis();
  db.doc('config/societe').onSnapshot(s=>{socDb=s.exists?s.data():null;if(view==='soc'&&!socDraft)renderSoc()},()=>{});
  db.doc('config/catalogue').onSnapshot(s=>{
    if(s.exists&&Array.isArray(s.data().items)){catalog=migrateCat(clone(s.data().items));catFromDb=true;ruleCache.clear();
      if(view==='devis'&&!document.activeElement?.closest('#v-devis input,#v-devis textarea'))renderDevisKeepScroll();
      if(view==='tarifs'&&!catDraft)renderTarifs();}
    else if(!s.exists){toast('Aucun tarif en base : onglet Tarifs → Importer le fichier de tarifs, puis Enregistrer.')}});
  db.collection('devis').orderBy('updated','desc').limit(500).onSnapshot(s=>{
    savedList=s.docs.map(d=>d.data());$('#cnt').textContent=savedList.length?String(savedList.length):'';
    if(view==='liste'&&!document.activeElement?.closest('#v-liste'))renderListe();});}
(()=>{
  const cfg=window.HYDREAU_FIREBASE||{};
  if(!window.firebase||!cfg.apiKey||/VOTRE/.test(cfg.apiKey)){showLogin('Configuration manquante : renseignez config.js (configuration Firebase).');return}
  firebase.initializeApp(cfg);fsdb=firebase.firestore();const auth=firebase.auth();
  auth.onAuthStateChanged(u=>{if(u)startSession(u);else showLogin()});
  $('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-err').textContent='';$('#l-go').disabled=true;
    try{await auth.signInWithEmailAndPassword($('#l-mail').value.trim().toLowerCase(),$('#l-pass').value)}
    catch(err){$('#login-err').textContent='E-mail ou mot de passe incorrect.'}finally{$('#l-go').disabled=false}});
  $('#l-forgot').addEventListener('click',async()=>{const m=$('#l-mail').value.trim();if(!m){$('#login-err').textContent='Saisissez d’abord votre e-mail.';return}
    try{await auth.sendPasswordResetEmail(m);$('#login-err').textContent='E-mail de réinitialisation envoyé.'}catch(e){$('#login-err').textContent='Envoi impossible pour cette adresse.'}});
  $('#b-logout').addEventListener('click',async()=>{await auth.signOut();location.reload()});
})();
</script>

</body>
