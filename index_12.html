<title>Chiffrage Géothermie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F5F4; --panel:#FFFFFF; --panel2:#EAEEEC; --ink:#17221F; --ink2:#4E5C58; --ink3:#83908C;
  --line:#D5DDDA; --accent:#0E5E78; --accent-ink:#FFFFFF; --accent-soft:#DCEBF0;
  --racc:#0E5E78; --forage:#A4581C; --loc:#4F6B3A; --plf:#E0182D;
  --racc-soft:#E0EDF2; --forage-soft:#F5E7DA; --loc-soft:#E6EDDF;
  --auto:#2F7A5B; --warn:#A8471B; --focus:#1C8FB5;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 18px rgba(20,40,35,.06);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#111816; --panel:#18211F; --panel2:#1F2A27; --ink:#E4ECE9; --ink2:#A6B4AF; --ink3:#71807B;
  --line:#2C3935; --accent:#4DB3D4; --accent-ink:#06222C; --accent-soft:#16333D;
  --racc:#5DB6D6; --forage:#E09356; --loc:#9CBF7E; --plf:#FF4D5E;
  --racc-soft:#15303A; --forage-soft:#3A2819; --loc-soft:#23301B;
  --auto:#6CC79E; --warn:#F08A5B; --focus:#5CC3E6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111816; --panel:#18211F; --panel2:#1F2A27; --ink:#E4ECE9; --ink2:#A6B4AF; --ink3:#71807B;
  --line:#2C3935; --accent:#4DB3D4; --accent-ink:#06222C; --accent-soft:#16333D;
  --racc:#5DB6D6; --forage:#E09356; --loc:#9CBF7E; --plf:#FF4D5E;
  --racc-soft:#15303A; --forage-soft:#3A2819; --loc-soft:#23301B;
  --auto:#6CC79E; --warn:#F08A5B; --focus:#5CC3E6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.005em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:end;gap:8px 20px}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.brand .logo{flex:none;height:46px;width:auto;background:#fff;border-radius:6px;padding:3px 5px}
.brand h1{font-size:22px;font-weight:800;line-height:1}
.brand small{display:block;font-family:var(--body);font-stretch:100%;font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.02em;margin-top:3px}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;padding:10px 14px 11px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:4px}

/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}

.view{padding-top:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.toolbar .title{font-family:var(--display);font-stretch:85%;font-size:26px;font-weight:800;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.status{font-size:13px;color:var(--ink3)}
.status.dirty{color:var(--warn)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:700}
.card-b{padding:14px 16px}

/* chantier */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--focus);outline:none}
.f textarea{resize:vertical;min-height:38px}

.params{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:720px){.params{grid-template-columns:minmax(0,1fr)}}

/* sections */

.sec-h h2{font-size:19px;font-weight:800}
.sec-h .sub{font-size:13px;color:var(--ink3)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}

td.unit{color:var(--ink3);font-size:13px;width:70px}

.qin:focus{border-color:var(--focus);outline:none}
.qin.is-auto{border-color:color-mix(in srgb,var(--auto) 45%,var(--line));color:var(--auto)}

.chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 5px;border-radius:3px;white-space:nowrap}
.chip.auto{color:var(--auto);background:color-mix(in srgb,var(--auto) 13%,transparent)}
.chip.man{color:var(--ink2);background:var(--panel2)}
.reset{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px}
.reset:hover{color:var(--ink);background:var(--panel2)}
.pchg{color:var(--warn);font-size:11px;margin-left:4px}

.pbreak{border-top:2px dashed var(--ink3);text-align:center;color:var(--ink3);font-size:12px;padding:5px 0 2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dimg{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:4px 0}

.xin{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}

<script>
const DATA = {"catalog": []};
const SECS=[
  {id:'racc',label:'Raccordement',sub:'Collecteur, PE, raccords, vannes, glycol, terrassement'},
  {id:'forage',label:'Forage',sub:'Sondes, cimentation, carburant, équipe'},
  {id:'loc',label:'Déplacements & sous-traitance',sub:'Hébergement, trajets, TRT'}
];
const DEF_COEF={racc:1.6,forage:2,loc:1.3};
const clone=o=>JSON.parse(JSON.stringify(o));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtE=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtE0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtN=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const eur=v=>fmtE.format(v||0), eur0=v=>fmtE0.format(v||0), nf=v=>fmtN.format(v||0);
const pnum=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- formula engine ---------- */
const FN={ceil:Math.ceil,floor:Math.floor,round:Math.round,max:Math.max,min:Math.min};
const VARS=['N','P','M','L','J','E','D1','D2','LF','LC','T','JR','VR','GLY','ZO','NA','NB','LCB','D2B','NC'];
const ruleCache=new Map();
function compile(rule){
  if(ruleCache.has(rule))return ruleCache.get(rule);
  let f=null;
  const src=rule.replace(/(\d),(\d)/g,'$1.$2');
  const toks=src.match(/\s+|[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|&&|\|\||[<>=!]=|[-+*/()<>?:,!]/g)||[];
  if(toks.join('')===src && toks.every(t=>!/^[A-Za-z_]/.test(t)||VARS.includes(t)||FN[t])){
    try{f=new Function('ceil','floor','round','max','min',...VARS,'return ('+src+');')}catch(e){f=null}
  }
  ruleCache.set(rule,f);return f;
}
function evalRule(rule,v){
  if(!rule||!rule.trim())return null;
  const f=compile(rule.trim()); if(!f)return NaN;
  try{const r=Number(f(FN.ceil,FN.floor,FN.round,FN.max,FN.min,...VARS.map(k=>v[k])));return isFinite(r)?Math.round(r*100)/100:NaN}catch(e){return NaN}
}

/* ---------- state ---------- */
let catalog=migrateCat(clone(DATA.catalog));
let quote=null;
let savedList=[];
let db=null, dlApi=null, canWrite=true, catFromDb=false;
let dirty=false, view='devis', usedOnly=false, catDraft=null, listFilter='';

function blankQuote(){
  return {id:null,nom:'',lieu:'',client:'',tel:'',mail:'',archi:'',interlocuteur:'',chiffreur:'Fred',
    date:new Date().toISOString().slice(0,10),N:1,P:100,L:20,D2:0,mpj:100,jr:2,com:0,ffm:20,obj:80,h:{wpm:null,dT:3,conc:30,sing:30,pac:0,model:'',qPac:null,dispo:null},E:10,D1:0,nc:1,N2:null,L2:null,D2b:0,df1:null,df2:null,pn:0,plan:null,coef:{...DEF_COEF},q:{},snap:{},extra:[],prixRetenu:null,tva:20,notes:'',updated:0,dvs:null};
}
function normQuote(q){const b=blankQuote();const o=Object.assign(b,clone(q));o.h=Object.assign(blankQuote().h,o.h||{});o.coef=Object.assign({...DEF_COEF},o.coef||{});o.q=o.q||{};o.snap=o.snap||{};o.extra=o.extra||[];return o}

/* PN des sondes : auto = PN16 jusqu'à 150 m, PN20 au-delà */
function pnSonde(P){const p=+quote.pn||0;return p||(P>150?20:16)}
function sdrPN(pn){return pn==25?7.4:pn==20?9:11}
/* ---------- plan d'implantation (coordonnées en mètres) ---------- */
function planItems(){return (quote&&quote.plan&&Array.isArray(quote.plan.items))?quote.plan.items:[]}
function planOn(){const it=planItems();return !!(quote.plan&&quote.plan.on&&it.some(i=>i.k==='f')&&it.some(i=>i.k==='c'))}
const r1=x=>Math.round(x*10)/10;
function planDist(a,b){return quote.plan&&quote.plan.trace==='equerre'?Math.abs(a.x-b.x)+Math.abs(a.y-b.y):Math.hypot(a.x-b.x,a.y-b.y)}
/* tracé de chaque liaison : points de passage enregistrés dans quote.plan.routes, clé 'f:<id du forage>' ou 'c:<n° collecteur>' */
function plId(i){if(!i.id)i.id=Math.random().toString(36).slice(2,9);return i.id}
function routeKey(a){return a.k==='f'?'f:'+plId(a):'c:'+(a.i||0)}
function routeWps(a){const r=quote.plan&&quote.plan.routes;const w=r&&r[routeKey(a)];return Array.isArray(w)?w:[]}
/* ---------- tranchées dessinées : les liaisons suivent le réseau (plus court chemin) ---------- */
function trActive(){const t=quote.plan&&quote.plan.trenches;return Array.isArray(t)&&t.some(x=>x&&x.length>1)}
let _net={key:null};

function fluid(c){c=Math.max(0,Math.min(50,+c||0));let i=0;while(i<MPG.length-2&&c>MPG[i+1][0])i++;const a=MPG[i],b=MPG[i+1],k=(c-a[0])/(b[0]-a[0]);const f=j=>a[j]+(b[j]-a[j])*k;return {mu:f(1)/1000,rho:f(2),cp:f(3)}}
function friction(Re,Dm){const eps=0.00001;if(Re<=0)return 0;if(Re<2300)return 64/Re;
  const turb=r=>0.25/Math.pow(Math.log10(eps/(3.7*Dm)+5.74/Math.pow(r,0.9)),2);
  if(Re<4000){const k=(Re-2300)/1700;return 64/2300*(1-k)+turb(4000)*k}return turb(Re)}
function wallPE(D,sdr=11){return sdr==11?(PE_E[D]||D/11):Math.ceil(D/sdr*10)/10}
function segment(name,D,L,Qm3h,fl,note,sdr=11){const DI=(D-2*wallPE(D,sdr))/1000;const A=Math.PI*DI*DI/4;const v=Qm3h/3600/A;
  const Re=v*DI*fl.rho/fl.mu;const f=friction(Re,DI);const dp=f*(L/DI)*fl.rho*v*v/2/1000;return {name,D,DI:DI*1000,L,Q:Qm3h,v,Re,dp,note}}
function hydro(){return hydroFor(vars())}
function hydroFor(v){
  const h=quote.h,fl=fluid(concGly());const N=Math.max(1,v.N);
  const wpm=h.wpm!=null&&h.wpm!==''?+h.wpm:50;const kwAuto=Math.round(v.M*wpm/100)/10;const kw=kwAuto;const dT=+h.dT||3;
  const qCalc=kw/(fl.rho*fl.cp*dT)*3600; /* m³/h */
  const Q=+h.qPac>0?+h.qPac:qCalc;
  const Ds=v.P>150?40:32,pn=pnSonde(v.P),sdr=sdrPN(pn);
  const so=segment('Sonde (une boucle du double U)',Ds,2*v.P,Q/(2*N),fl,`${nf(v.P)} m × 2 (descente + remontée) · Ø${Ds} PN${pn}`,sdr);
  const G=v.G&&v.G.length?v.G:[{n:v.N,DF:v.DF,L:v.L}],two=G.length>1,sf=1+(+h.sing||0)/100;
  const groups=G.map((g,i)=>{const lab=two?' '+(i+1):'';const D2g=i?v.D2B:v.D2;const au=i?v.D2Bauto:v.D2auto;
    const br=segment('Forage le plus éloigné → collecteur'+lab,v.D1||40,2*g.DF,Q/N,fl,`${nf(g.DF)} m × 2 (aller + retour) · ${g.DFman?'distance saisie':v.src==='plan'?'mesuré sur le plan':'collecteur '+(quote.coll==='milieu'?'au milieu':'au bout')}${v.D1auto?' · Ø selon profondeur':''}`);
    const mn=segment('Collecteur'+lab+' → chaufferie',D2g||63,2*g.L,Q*(g.n||0)/N,fl,`${two?g.n+' forage'+pl(g.n)+' · ':''}${nf(g.L)} m × 2 (aller + retour)${au?' · Ø choisi selon le débit':''}`);
    const path=so.dp+br.dp+mn.dp;return {i,n:g.n,br,mn,path,pathRes:path*sf}});
  const crit=groups.reduce((a,g)=>!a||g.path>a.path?g:a,null);
  const segs=[so];groups.forEach(g=>{g.br.crit=g.mn.crit=two&&g===crit;segs.push(g.br,g.mn)});
  const lin=crit?crit.path:so.dp,sing=lin*(+h.sing||0)/100,pac=+h.pac||0,tot=lin+sing+pac;
  const reseau=lin+sing,dispo=+h.dispo||0;
  const verdict=dispo>0?(dispo>=reseau?{ok:true,txt:`Le circulateur de la PAC suffit : ${nf(dispo)} kPa disponibles pour ${nf(reseau)} kPa de réseau (marge ${nf(dispo-reseau)} kPa).`}
    :{ok:false,txt:`Circulateur de la PAC insuffisant : il manque ${nf(reseau-dispo)} kPa (${nf((reseau-dispo)*1000/(fl.rho*9.81))} mCE). Prévoir un circulateur complémentaire ou augmenter les diamètres.`}):null;
  return {kw,kwAuto,wpm,qCalc,Q,fl,segs,so,groups,crit,two,pn,sdr,lin,sing,pac,tot,reseau,dispo,verdict,mce:tot*1000/(fl.rho*9.81)}
}

/* alertes de dimensionnement des tuyaux */
const LIM={vMax:1.0,vBranch:1.2,vMin:0.15,paMain:150,paBranch:250,loopKpa:40};
function fitD(list,L,Q,fl,paMax){for(const D of list){const g=segment('',D,L||1,Q,fl);if(g.v<=LIM.vMax&&g.dp*1000/(L||1)<=paMax&&g.dp<=SEG_MAX)return D}return null}
function sizingAlerts(v,r){
  const A=[];const so=r.so;const pam=g=>g.L?g.dp*1000/g.L:0;
  if(so.Re<2300)A.push({lvl:'warn',seg:0,txt:`Sondes : écoulement laminaire (Re ${Math.round(so.Re)}). Échange thermique réduit : augmenter le débit ou réduire le glycol.`});
  if(so.v>LIM.vMax)A.push({lvl:'bad',seg:0,txt:`Sondes Ø${so.D} : vitesse ${nf(so.v)} m/s trop élevée pour le débit par boucle.`});
  if(so.dp>LIM.loopKpa)A.push({lvl:'warn',seg:0,txt:`Sondes : ${nf(so.dp)} kPa par boucle, perte élevée (profondeur ou débit important).`});
  const d1Rule=v.P>150?50:40;
  if(!v.D1auto&&v.D1!==d1Rule)A.push({lvl:'warn',seg:1,txt:`Liaisons forages → collecteur en Ø${v.D1} : la règle est Ø${d1Rule} pour ${nf(v.P)} m de profondeur.`});
  for(const g of r.groups){const br=g.br,mn=g.mn,lab=r.two?' '+(g.i+1):'',au=g.i?v.D2Bauto:v.D2auto;
  /* liaisons forages → collecteur : on suit la pratique Hydreau (sonde Ø32 → liaison Ø40, sonde Ø40 → liaison Ø50) ; alerte seulement si la vitesse devient vraiment excessive */
  if(br.L&&br.v>LIM.vBranch)A.push({lvl:'warn',seg:1,txt:`Liaisons forages → collecteur${lab} Ø${br.D} : vitesse élevée (${nf(br.v)} m/s, ${Math.round(pam(br))} Pa/m) pour ce débit par forage.`})
  else if(br.L&&br.v<LIM.vMin)A.push({lvl:'warn',seg:1,txt:`Liaisons forages → collecteur${lab} Ø${br.D} surdimensionnées (${nf(br.v)} m/s) : un diamètre plus petit suffit.`});
  if(mn.L&&(mn.v>LIM.vMax||pam(mn)>LIM.paMain||mn.dp>SEG_MAX)){const s=fitD(d2List().filter(D=>D>mn.D),mn.L,mn.Q,r.fl,LIM.paMain);
    A.push({lvl:'bad',seg:2,txt:`Collecteur${lab} → chaufferie Ø${mn.D} sous-dimensionné (${nf(mn.v)} m/s, ${Math.round(pam(mn))} Pa/m, ${nf(mn.dp)} kPa sur ${nf(mn.L)} m).${s?` Passer en Ø${s}.`:''}${au?'':' (diamètre choisi à la main : mettre « Auto (selon débit) » pour qu’il suive le débit)'}`})}
  else if(!au){const rec=autoD2(v,g.i).D;if(rec>mn.D)A.push({lvl:'bad',seg:2,txt:`Collecteur${lab} → chaufferie en Ø${mn.D} : Ø${rec} recommandé pour ce débit${r.dispo>0?' et la pression disponible de la PAC':''}.`});
    else if(mn.v<LIM.vMin&&mn.L)A.push({lvl:'warn',seg:2,txt:`Collecteur${lab} → chaufferie Ø${mn.D} surdimensionné (${nf(mn.v)} m/s) : Ø${rec} suffit.`})}}
  if(r.verdict&&!r.verdict.ok)A.push({lvl:'bad',seg:-1,txt:r.verdict.txt});
  /* le métré de PE n'est chiffré que si un article du bon Ø a une règle et un prix */
  const pe=(D,len)=>{if(!(len>0))return;const it=catalog.filter(i=>/\bPE\b/i.test(i.grp||'')&&new RegExp('[øØ]\\s*'+D+'\\b').test(i.name||'')&&String(i.rule||'').includes(String(D)));
    if(!it.length)A.push({lvl:'bad',seg:-2,txt:`PE Ø${D} : aucun article avec règle dans les Tarifs, les ${nf(len)} m ne sont pas chiffrés.`})};
  /* contrôles du chiffrage : sondes, collecteur, articles utilisés à 0 € */
  const used=lines().filter(l=>l.src!=='extra'&&qtyOf(l,v)>0);
  if(v.N>0&&v.P>0&&!used.some(l=>/sonde/i.test(l.grp||'')))A.push({lvl:'bad',seg:-2,txt:`Aucune sonde comptée pour des forages de ${nf(v.P)} m : ajouter la bonne longueur dans Tarifs (règle) ou saisir la quantité à la main.`});
  const nCol=used.filter(l=>/collecteur/i.test(l.grp||'')).reduce((a,l)=>a+qtyOf(l,v),0);
  if(v.N>=2&&!nCol)A.push({lvl:'bad',seg:-2,txt:v.NC>1?`Aucun collecteur compté pour 2 collecteurs (${v.NA} + ${v.NB} forages) : saisir les quantités à la main ou ajouter les collecteurs dans Tarifs.`:`Aucun collecteur compté pour ${v.N} forages : saisir la quantité de « Autre collecteur » (ou ajouter un collecteur ${v.N} sorties dans Tarifs).`});
  else if(v.N>=2&&v.NC>1&&nCol<2)A.push({lvl:'bad',seg:-2,txt:`Un seul collecteur compté pour 2 collecteurs prévus (${v.NA} + ${v.NB} forages) : vérifier les quantités de la catégorie Collecteur.`});
  const zero=used.filter(l=>!(+l.price>0)&&l.id!=='decl');
  if(zero.length)A.push({lvl:'bad',seg:-2,txt:`Article${pl(zero.length)} utilisé${pl(zero.length)} avec un prix à 0 € : ${zero.map(l=>(l.grp&&!new RegExp(String(l.grp).split(' ')[0].replace(/s$/,''),'i').test(l.name||'')?l.grp+' ':'')+l.name).join(', ')}. Renseigner le prix dans Tarifs.`});
  {const m=new Map();[[v.D1,v.LF],[v.D2,v.LC],[v.D2B,v.LCB]].forEach(([D,l])=>{if(D&&l>0)m.set(D,(m.get(D)||0)+l)});m.forEach((l,D)=>pe(D,l))}
  return A}

  pg.C.map((c,j)=>({c,j})).sort((a,b)=>(a.c.i||0)-(b.c.i||0)).forEach(({c,j})=>{
    const ref=pg.ch&&Math.hypot(pg.ch.x-c.x,pg.ch.y-c.y)>.01?Math.atan2(pg.ch.y-c.y,pg.ch.x-c.x):-Math.PI/2;

    const ang=(o,a,b)=>{let x=Math.atan2(b.y-a.y,b.x-a.x)-o;while(x<=1e-6)x+=Math.PI*2;return Math.round(x*100)/100};

/* sous-traitance (TRT, zone orange…) : hors production, ajoutée par-dessus l'objectif au mètre */
function isST(l){return l.src==='extra'?!!l.st:kindOf(l)==='st'}
function stMarge(){return quote.stm!=null&&quote.stm!==''?+quote.stm:15}
function stVente(t){t=t||totals();const v=t.v;let s=0;for(const l of lines()){if(!isST(l))continue;const q=qtyOf(l,v);if(q>0)s+=q*(+l.price||0)*(1+stMarge()/100)}return r2(s)}
/* coefficient appliqué à la production (hors sous-traitance) pour tomber sur le prix retenu */
function kProd(t){t=t||totals();const stV=stVente(t),pe=prixEff(t);return t.tp-stV>0.005?(pe-stV)/(t.tp-stV):1}
function unitVente(l,k){return isST(l)?(+l.price||0)*(1+stMarge()/100):(+l.price||0)*(+quote.coef[l.sec]||0)*k}
function objPrix(t){t=t||totals();const b=Math.round((+quote.obj||0)*t.v.M);return b>0?r2(b+stVente(t)):0}
function prixEff(t){const pObj=objPrix(t);return quote.prixRetenu!=null?+quote.prixRetenu:(pObj||t.tp)}

  const bar=$('.bar');if(bar)bar.innerHTML=SECS.map(s=>`<span style="width:${t.tp?100*t.pv[s.id]/t.tp:0}%;background:var(--${s.id})"></span>`).join('');
  $('#s-total').textContent=eur(t.tp);$('#s-perm').textContent=t.v.M?eur(t.tp/t.v.M):'–';$('#s-cost').textContent=eur(t.tc);

  const pn=$('#s-prixnote');if(pn)pn.textContent=quote.prixRetenu!=null?'Prix saisi à la main — videz la case pour revenir à l’objectif':pObj?`Prix retenu = ${nf(+quote.obj)} €/m × ${nf(t.v.M)} m${stv?' + sous-traitance '+eur(stv):''}`:'Prix retenu = prix calculé';
  if(pn){const low=stv>0&&pr<stv;pn.classList.toggle('bad',low);if(low)pn.textContent=`Attention : prix retenu inférieur à la sous-traitance refacturée (${eur(stv)}).`}
  const ec=pr-t.tp;const e=$('#s-ecart');e.textContent=Math.abs(ec)>0.005?(ec>=0?'+':'')+eur(ec):'–';e.className='v '+(Math.abs(ec)<=0.005?'':ec>=0?'good':'bad');

  $('#s-ttc').textContent=eur(pr*(1+(+quote.tva||0)/100));

  const com=pr*(+quote.com||0)/100, ff=(+quote.ffm||0)*t.v.M, net=mg-com-ff;
  $('#s-ded').textContent='− '+eur(com+ff);
  const ne=$('#s-net');ne.textContent=`${eur(net)} · ${pr?nf(100*net/pr):0} %`;ne.className='v strong '+(net>=0?'good':'bad');
  const d=vars();$('#d-M').textContent=nf(d.M)+' m';$('#d-J').textContent=d.J+' j';$('#d-ML').textContent=nf(d.M+d.L)+' m';$('#d-T').textContent=nf(d.T)+' m';$('#d-LF').textContent=`${nf(d.LF)} m Ø${d.D1}${d.D1auto?' (auto)':''}`;$('#d-LC').textContent=`${nf(d.LC)} m Ø${d.D2}${d.D2auto?' (auto)':''}`+(d.NC>1?` + ${nf(d.LCB)} m Ø${d.D2B}${d.D2Bauto?' (auto)':''}`:'');
  const na=$('#d-NA');if(na)na.value=d.NA;planLocks();const pin=$('#pl-info');if(pin)pin.innerHTML=planInfo();
  const c=$('#coupe');if(c)c.innerHTML=coupeSVG();

const CGV_DEF=`CONDITIONS GÉNÉRALES DE VENTE ET DE GARANTIE

Article 1 – Objet
1.1 – Les présentes conditions s'appliquent aux travaux de forage (géothermie, eau), de pose de sondes géothermiques, de raccordement et de pompage réalisés par Hydreau Forage. La signature du devis vaut acceptation des présentes conditions.
1.2 – Le devis est établi gratuitement. Il est valable pendant la durée indiquée ; au-delà, les prix peuvent être révisés.

Article 2 – Le forage
2.1 – Le choix du lieu d'implantation du forage relève de la seule responsabilité du client, après vérification des conditions réglementaires qui lui sont applicables.
2.2 – Les dégradations éventuelles pour accéder à l'aire de foration ne peuvent être imputées à Hydreau Forage.
2.3 – La fourniture d'eau et d'électricité nécessaire au chantier reste à la charge du client.
2.4 – Sauf mention contraire au devis, la remise en état du site après travaux est à la charge du client, qui assume également les conséquences directes ou indirectes de l'écoulement des rejets du forage.
2.5 – Si, lors de la foration, le débit du forage s'avère inexploitable ou s'il est impossible de mettre en œuvre les tubes de forage ou les sondes géothermiques, le forage sera facturé en sondage.
2.6 – Le client communique avant le démarrage les plans des réseaux enterrés dont il a connaissance. Hydreau Forage ne peut être tenu responsable de la casse de réseaux non repérés.

Article 3 – Débit des forages d'eau et pompage
3.1 – Hydreau Forage garantit au client le débit du forage à condition que l'installation de pompage soit réalisée par Hydreau Forage ou l'un de ses partenaires, et que le débit de pompage ne dépasse pas 70 % de la capacité du forage suivant les recommandations du foreur. Cette garantie est valable un an à compter de la date de facture.
3.2 – Sont exclus de la garantie : la diminution ou l'arrêt du débit dus à un séisme, un mouvement de terrain, un fait de guerre et plus généralement tout cas de force majeure ; en géothermie avec prélèvement et rejet d'eau, la saturation du forage de rejet et son débordement ; la potabilité et la qualité de l'eau (fer, sable, nitrates, bactéries…) ; le colmatage du forage dû à un excès de fer ou de sédiments.
3.3 – Les fournitures (pompes, matériels) sont garanties un an à compter de leur livraison, pour un usage normal, après examen de la pièce défectueuse retournée franco de port.

Article 4 – Sondes géothermiques
4.1 – Les travaux de forage et de pose des sondes géothermiques relèvent de la responsabilité décennale d'Hydreau Forage (articles 1792 et suivants du Code civil), dans des conditions normales d'utilisation.
4.2 – La longueur totale de sondes est déterminée par le fabricant ou l'installateur de la pompe à chaleur, ou par le bureau d'études. Hydreau Forage ne peut être tenu responsable d'une erreur de détermination de cette longueur.

Article 5 – Prix, facturation et paiement
5.1 – Les prix sont établis en euros hors taxes, départ Tréglamus ou Laillé, montage non compris sauf mention contraire. La TVA est celle en vigueur à la date de facturation ; un taux réduit n'est appliqué que sur remise par le client de l'attestation requise.
5.2 – Toute prestation non prévue au devis fait l'objet d'un avenant ou d'un devis complémentaire accepté par le client. La facturation tient compte des quantités réellement mises en œuvre (mètres forés, longueurs posées) et du temps réellement passé pour les prestations en régie.
5.3 – Sauf conditions particulières du devis, les factures sont payables à réception, sans escompte pour paiement anticipé.
5.4 – Client professionnel : tout retard de paiement entraîne de plein droit des pénalités au taux de 1,5 % par mois, sans pouvoir être inférieur à trois fois le taux d'intérêt légal, et une indemnité forfaitaire pour frais de recouvrement de 40 € (articles L441-10 et D441-5 du Code de commerce). Client consommateur : les sommes dues portent intérêt au taux légal après mise en demeure.

Article 6 – Réserve de propriété
Les fournitures restent la propriété d'Hydreau Forage jusqu'au paiement intégral du prix (articles 2367 et suivants du Code civil). Les risques sont transférés au client dès leur livraison sur le chantier.

Article 7 – Délais d'exécution
Les délais sont donnés dans des conditions normales d'activité, de météo et d'accès au chantier. Un retard dû à la force majeure, aux intempéries, à la nature imprévisible du sous-sol ou à un fait du client ne peut donner lieu à dommages et intérêts ni à annulation de la commande.

Article 8 – Droit de rétractation (clients consommateurs)
8.1 – Lorsque le contrat est conclu hors établissement ou à distance avec un consommateur, celui-ci dispose d'un délai de quatorze jours à compter de sa conclusion pour se rétracter, sans avoir à motiver sa décision (articles L221-18 et suivants du Code de la consommation), au moyen du formulaire ci-après ou de toute autre déclaration dénuée d'ambiguïté.
8.2 – Pour un contrat conclu hors établissement, aucun paiement ni acompte ne peut être exigé avant l'expiration d'un délai de sept jours à compter de sa conclusion (article L221-10).
8.3 – Si le consommateur demande expressément que les travaux commencent avant la fin du délai de rétractation, il reste redevable du montant correspondant aux travaux réalisés jusqu'à la communication de sa décision de se rétracter (article L221-25).

Article 9 – Médiation de la consommation
Conformément aux articles L612-1 et suivants du Code de la consommation, le client consommateur peut recourir gratuitement au médiateur de la consommation indiqué au devis, après une réclamation écrite adressée à Hydreau Forage restée sans réponse satisfaisante.

Article 10 – Assurances
Hydreau Forage est titulaire d'une assurance de responsabilité civile décennale dont l'assureur, le numéro de contrat et la couverture géographique figurent sur le devis.

Article 11 – Données personnelles
Les données du client servent uniquement à la gestion du chantier, à la facturation et aux déclarations réglementaires. Le client dispose d'un droit d'accès, de rectification et de suppression auprès de contact@hydreau-forage.fr.

Article 12 – Litiges
Les parties recherchent d'abord une solution amiable. À défaut, pour les clients professionnels, le Tribunal de commerce de Saint-Brieuc est seul compétent ; pour les clients consommateurs, la juridiction compétente est déterminée selon les règles de droit commun.`;

function dvpDirty(){markDirty();const s=$('#st2');if(s){s.textContent='Modifications non enregistrées';s.className='status dirty'}}
function onDvpInput(e){const tg=e.target,d=quote.dvs;if(!d)return;
  if(tg.id==='p-cible'){d.cible=pnum(tg.value);dvpDirty();return}
  if(tg.dataset.p){d[tg.dataset.p]=tg.value;if(tg.dataset.p==='numero')$('#v-dvp .toolbar .title').textContent='Devis '+tg.value;dvpDirty();return}
  if(tg.dataset.lf){const tr=tg.closest('tr');const l=d.lines[+tr.dataset.i];if(!l)return;const f=tg.dataset.lf;
    l[f]=(f==='q'||f==='pu')?(pnum(tg.value)??0):(f==='tva'||f==='w')?+tg.value:tg.value;dvpDirty();
    if(f==='q'||f==='pu'||f==='tva'){const c=tr.querySelector('td.tot');if(c)c.textContent=eur(r2((+l.q||0)*(+l.pu||0)));$('#p-tot').innerHTML=dvpTotalsHTML()}}}
function dvpRerender(){const y=window.scrollY;renderDvp();window.scrollTo(0,y)}
async function onDvpClick(e){const b=e.target.closest('button');if(!b)return;const d=quote.dvs;
  if(b.id==='p-create'){quote.dvs=devisFromChiffrage();dvpDirty();renderDvp();return}
  if(b.id==='p-regen'){dvpConfirm=true;dvpRerender();return}
  if(b.id==='p-regen-no'){dvpConfirm=false;dvpRerender();return}
  if(b.id==='p-regen-ok'){dvpConfirm=false;quote.dvs=devisFromChiffrage();dvpDirty();dvpRerender();toast('Lignes recréées depuis le chiffrage');return}
  if(b.id==='p-pdf'){exportPDF('devis');return}
  if(b.id==='p-save'){await saveQuote();renderDvp();return}
  if(b.id==='p-ajust'){ajusterDevis();return}
  if(b.id==='p-addx'){addExtras();return}
  if(!d)return;const n=d.lines.length;
  if(b.id==='p-addsec'){d.lines.push({id:lid(),type:'sec',name:'Nouvelle section'});dvpDirty();dvpRerender();$(`#p-body tr[data-i="${n}"] input`)?.select();return}
  if(b.id==='p-addline'){d.lines.push({id:lid(),type:'line',name:'',desc:'',q:1,unit:'forfait',pu:0,tva:tvaDef()});dvpDirty();dvpRerender();$(`#p-body tr[data-i="${n}"] input`)?.focus();return}
  if(b.id==='p-addimg'){pickImg(n,true);return}
  if(b.id==='p-addbrk'){d.lines.push({id:lid(),type:'break'});dvpDirty();dvpRerender();return}
  if(b.dataset.insimg){pickImg(+b.dataset.insimg+1,true);return}
  if(b.dataset.insbrk){d.lines.splice(+b.dataset.insbrk+1,0,{id:lid(),type:'break'});dvpDirty();dvpRerender();return}
  if(b.dataset.imgpick){pickImg(+b.dataset.imgpick,false);return}
  if(b.dataset.imgsmall){shrinkImg(+b.dataset.imgsmall);return}
  const mv=(i,j)=>{const x=d.lines.splice(i,1)[0];d.lines.splice(j,0,x);dvpDirty();dvpRerender()};
  if(b.dataset.up){const i=+b.dataset.up;if(i>0)mv(i,i-1);return}
  if(b.dataset.down){const i=+b.dataset.down;if(i<n-1)mv(i,i+1);return}
  if(b.dataset.del){d.lines.splice(+b.dataset.del,1);dvpDirty();dvpRerender();return}
  if(b.dataset.ins){const i=+b.dataset.ins;d.lines.splice(i+1,0,{id:lid(),type:'line',name:'',desc:'',q:1,unit:'forfait',pu:0,tva:tvaDef()});dvpDirty();dvpRerender();$(`#p-body tr[data-i="${i+1}"] input`)?.focus();return}
}

function onListeClick(e){
  const b=e.target.closest('button');
  if(b?.id==='l-new'){quote=blankQuote();dirty=false;go('devis');return}
  if(b?.dataset.del){const cell=b.parentElement;cell.innerHTML=`<span class="confirm">Supprimer ? <button class="btn sm danger" data-delok="${b.dataset.del}">Oui</button><button class="btn sm ghost" data-delno="1">Non</button></span>`;return}
  if(b?.dataset.delok){deleteQuote(b.dataset.delok);return}
  if(b?.dataset.delno){renderListe();return}
  const tr=e.target.closest('tr[data-open]');if(tr&&!e.target.closest('[data-del-cell]')){const q=savedList.find(x=>x.id===tr.dataset.open);if(q)openQuote(q)}
}

/* ---------- view: tarifs ---------- */
function renderTarifs(){
  const el=$('#v-tarifs');const items=catDraft||catalog;const v=quote?vars():{N:1,P:100,L:20,M:100,J:1};
  el.innerHTML=`<div class="toolbar"><div class="title">Tarifs & règles de quantité</div>
    ${catDraft?'<span class="status dirty">Modifications non enregistrées</span><button class="btn ghost" id="t-cancel">Annuler</button>':''}
    <button class="btn ghost" id="t-export">Exporter</button><label class="btn ghost" for="t-import">Importer</label><input type="file" id="t-import" accept=".json,application/json" hidden>
    <button class="btn primary" id="t-save" ${catDraft&&db&&canWrite?'':'disabled'}>Enregistrer les tarifs</button></div>
  <div class="card" style="margin-bottom:18px"><div class="card-b help">
    Les prix sont en € HT. Chaque catégorie a son bouton <b>+ Article</b> ; renommez une catégorie en cliquant sur son titre, ou créez-en une avec <b>+ Nouvelle catégorie</b>. <b>Qté défaut</b> est reprise dans chaque nouveau chiffrage ; la <b>Règle</b>, si elle est remplie, la calcule à la place. Dans le chiffrage, toute quantité reste modifiable ligne par ligne.
    Variables : <code>N</code> nombre de forages · <code>P</code> profondeur par forage · <code>M</code> mètres forés (N×P) · <code>J</code> jours de forage · <code>E</code> espacement entre forages · <code>LF</code> PE forages → collecteur, aller-retour (E×N×(N+1)) · <code>D1</code> son diamètre · <code>L</code> distance collecteur → chaufferie · <code>LC</code> PE collecteur → chaufferie, aller-retour (2×L) · <code>D2</code> son diamètre · avec 2 collecteurs : <code>NA</code> / <code>NB</code> forages sur le collecteur 1 / 2, <code>LCB</code> PE collecteur 2 → chaufferie (aller-retour), <code>D2B</code> son diamètre, <code>NC</code> nombre de collecteurs · <code>T</code> longueur de tranchée (E×N + L, ou mesurée sur le plan) · <code>JR</code> temps de raccordement en jours (saisi dans le chiffrage) · <code>VR</code> volume total du réseau en litres (sondes + liaisons + chaufferie, selon les Ø) · <code>GLY</code> litres de glycol pur pour ce volume, à la dilution choisie dans « Perte de charge ».
    Exemples : <code>2*N</code>, <code>ceil(M/100)</code>, <code>P&gt;130&amp;&amp;P&lt;=140?N:0</code>, <code>(D1==40?LF:0)+(D2==40?LC:0)+(D2B==40?LCB:0)</code>, <code>(NA==6?1:0)+(NB==6?1:0)</code> pour un collecteur 6 sorties. La colonne « Test » montre le résultat pour le chiffrage en cours (${v.N} × ${nf(v.P)} m).
    ${!db?'<br><b>Enregistrement indisponible sur cette vue : tarifs par défaut affichés.</b>':''}
  </div></div>
  ${SECS.map(s=>{const ls=items.map((it,i)=>({it,i})).filter(o=>o.it.sec===s.id);let g=null,rows='';const ngrp=new Set(ls.map(o=>o.it.grp)).size;
    for(const {it,i} of ls){if(it.grp!==g){g=it.grp;rows+=`<tr class="grp tgrp"><td colspan="6"><input class="gname" data-g="${esc(g)}" data-sec="${s.id}" value="${esc(g)}" aria-label="Nom de la catégorie" title="Renommer la catégorie"></td><td class="r" colspan="2"><button class="btn sm ghost" data-tadd="${s.id}" data-grp="${esc(g)}">+ Article</button></td></tr>`}
      const r=evalRule(it.rule,v);const bad=it.rule&&!isFinite(r);
      rows+=`<tr data-i="${i}"><td><input data-t="name" value="${esc(it.name)}" aria-label="Désignation"></td><td style="width:80px"><input data-t="unit" value="${esc(it.unit)}" aria-label="Unité"></td><td style="width:130px"><select class="kd" data-t="kind" aria-label="Type">${KINDS.map(([k,lb])=>`<option value="${k}" ${kindOf(it)===k?'selected':''}>${lb}</option>`).join('')}</select></td><td style="width:110px"><input class="pr" data-t="price" inputmode="decimal" value="${esc(String(it.price).replace('.',','))}" aria-label="Prix HT"></td><td style="width:90px"><input class="pr" data-t="qty" inputmode="decimal" value="${it.qty?esc(String(it.qty).replace('.',',')):''}" placeholder="—" aria-label="Quantité par défaut"></td><td style="width:26%"><input class="rl ${bad?'err':''}" data-t="rule" value="${esc(it.rule)}" placeholder="—" aria-label="Règle"></td><td class="ev">${it.rule?(bad?'erreur':nf(r)):''}</td><td style="width:34px"><button class="reset" data-tdel="${i}" title="Supprimer l’article" aria-label="Supprimer l’article">✕</button></td></tr>`}
    return `<div class="card sec"><div class="sec-h"><span class="sw" style="background:var(--${s.id})"></span><div><h2>${s.label}</h2><div class="sub">${ngrp} catégories · ${ls.length} articles</div></div></div>
    <div class="tbl-wrap"><table class="tar"><thead><tr><th>Désignation</th><th>Unité</th><th>Type</th><th class="r">Prix HT</th><th class="r">Qté défaut</th><th>Règle de quantité</th><th class="r">Test</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sec-f"><button class="btn sm" data-tnewgrp="${s.id}">+ Nouvelle catégorie</button></div></div>`}).join('')}`;
}
function ensureDraft(){if(!catDraft){catDraft=clone(catalog);return true}return false}
function onTarifsInput(e){
  const tg=e.target;
  if(tg.classList.contains('gname')){const fresh=ensureDraft();const old=tg.dataset.g,sec=tg.dataset.sec,nv=tg.value;
    for(const it of catDraft)if(it.sec===sec&&it.grp===old)it.grp=nv;tg.dataset.g=nv;
    const ab=tg.closest('tr').querySelector('[data-tadd]');if(ab)ab.dataset.grp=nv;if(fresh)markTarDirty();return}
  if(!tg.dataset.t)return;const i=+tg.closest('tr').dataset.i;const fresh=ensureDraft();const it=catDraft[i];
  if(tg.dataset.t==='price')it.price=pnum(tg.value)??0;else if(tg.dataset.t==='qty'){const n=pnum(tg.value);if(n==null)delete it.qty;else it.qty=n}else it[tg.dataset.t]=tg.value;
  if(tg.dataset.t==='rule'){const v=vars();const r=evalRule(it.rule,v);const bad=it.rule&&!isFinite(r);tg.classList.toggle('err',!!bad);tg.closest('tr').querySelector('.ev').textContent=it.rule?(bad?'erreur':nf(r)):''}
  if(fresh)markTarDirty();
}
function markTarDirty(){{const tb=$('#v-tarifs .toolbar');tb.innerHTML=`<div class="title">Tarifs & règles de quantité</div><span class="status dirty">Modifications non enregistrées</span><button class="btn ghost" id="t-cancel">Annuler</button><button class="btn ghost" id="t-export">Exporter</button><label class="btn ghost" for="t-import">Importer</label><input type="file" id="t-import" accept=".json,application/json" hidden><button class="btn primary" id="t-save" ${db&&canWrite?'':'disabled'}>Enregistrer les tarifs</button>`}
}
async function exportTarifs(){const data=JSON.stringify({type:'hydreau-tarifs',version:1,date:new Date().toISOString(),items:catDraft||catalog},null,1);
  if(!dlApi){toast('Téléchargement indisponible');return}try{await dlApi.save({filename:`tarifs-hydreau-${new Date().toISOString().slice(0,10)}.json`,data})}catch(e){}}
async function importTarifs(file){try{const o=JSON.parse(await file.text());const items=Array.isArray(o)?o:o.items;
    if(!Array.isArray(items)||!items.length||!items.every(i=>i&&i.id&&i.sec&&i.name!=null))throw 0;
    catDraft=migrateCat(clone(items));renderTarifs();toast(`${items.length} articles importés — vérifiez puis cliquez sur « Enregistrer les tarifs »`)}
  catch(e){toast('Fichier de tarifs non reconnu')}}
async function onTarifsClick(e){
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tadd||b.dataset.tnewgrp){ensureDraft();const sec=b.dataset.tadd||b.dataset.tnewgrp;let grp=b.dataset.grp;
    if(b.dataset.tnewgrp){let n=1;grp='Nouvelle catégorie';while(catDraft.some(i=>i.sec===sec&&i.grp===grp))grp='Nouvelle catégorie '+(++n)}
    let idx=-1;catDraft.forEach((it,k)=>{if(it.sec===sec&&(b.dataset.tnewgrp||it.grp===grp))idx=k});
    if(idx<0){const k=SECS.findIndex(x=>x.id===sec);catDraft.forEach((it,j)=>{if(SECS.findIndex(x=>x.id===it.sec)<=k)idx=j})}
    catDraft.splice(idx+1,0,{id:'a_'+Math.random().toString(36).slice(2,8),sec,grp,name:'',unit:'u',price:0,rule:'',kind:'mat'});
    const y=window.scrollY;renderTarifs();window.scrollTo(0,y);
    const row=$(`#v-tarifs tr[data-i="${idx+1}"]`);if(b.dataset.tnewgrp){row?.previousElementSibling?.querySelector('.gname')?.select()}else row?.querySelector('[data-t="name"]')?.focus();return}
  if(b.dataset.tdel){ensureDraft();catDraft.splice(+b.dataset.tdel,1);const y=window.scrollY;renderTarifs();window.scrollTo(0,y);return}
  if(b.id==='t-cancel'){catDraft=null;renderTarifs();return}
  if(b.id==='t-export'){exportTarifs();return}
  if(b.id==='t-save'&&db){catDraft.forEach(it=>{if(!it.name.trim())it.name='Article sans nom';if(!it.grp.trim())it.grp='Divers'});try{await db.doc('config/catalogue').set({items:clone(catDraft),updated:Date.now()});catalog=catDraft;catDraft=null;ruleCache.clear();renderTarifs();toast('Tarifs enregistrés')}
    catch(e){toast(e?.code==='invalid_argument'?'Vous n’avez pas le droit de modifier les tarifs':'Échec de l’enregistrement, réessayez')}}
}

/* ---------- nav ---------- */
function go(v){view=v;store.set('view',v);
  for(const n of ['devis','liste','tarifs','soc']){$('#v-'+n).hidden=n!==v;$('#tab-'+n).setAttribute('aria-selected',n===v)}
  if(v==='devis')renderDevis();if(v==='liste')renderListe();if(v==='tarifs')renderTarifs();if(v==='dvp'){dvpConfirm=false;renderDvp()}if(v==='soc')renderSoc();window.scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.v)));
const vd=$('#v-devis');vd.addEventListener('input',onDevisInput);vd.addEventListener('change',onDevisChange);vd.addEventListener('click',onDevisClick);
$('#v-liste').addEventListener('click',onListeClick);$('#v-liste').addEventListener('input',e=>{if(e.target.id==='l-filter'){listFilter=e.target.value;const p=e.target.selectionStart;renderListe();const i=$('#l-filter');i.focus();i.setSelectionRange(p,p)}});
$('#v-tarifs').addEventListener('input',onTarifsInput);$('#v-tarifs').addEventListener('change',e=>{if(e.target.id==='t-import'&&e.target.files[0]){importTarifs(e.target.files[0]);e.target.value=''}});$('#v-tarifs').addEventListener('click',onTarifsClick);
$('#v-dvp').addEventListener('input',onDvpInput);$('#v-dvp').addEventListener('change',onDvpInput);$('#v-dvp').addEventListener('click',onDvpClick);
$('#v-soc').addEventListener('input',onSocInput);$('#v-soc').addEventListener('click',onSocClick);

/* ---------- boot ---------- */
(function boot(){
  let d=store.get('draft');if(d&&d.id==='plumergat')d=null;quote=d?normQuote(d):blankQuote();dirty=!!(d&&d.updated===0&&d.nom);
  {const u=store.get('usedOnly');usedOnly=u==null?true:!!u;}const v=store.get('view');
  go(['devis','liste','tarifs','soc'].includes(v)?v:'devis');
})();
/* ---------- Firebase : connexion + Firestore partagé ---------- */
let fsdb=null,fbUser=null;
function mapErr(e){return {code:e?.code==='permission-denied'?'invalid_argument':'unavailable',message:e?.message||''}}
function denied(e){if(e?.code==='permission-denied'){showLogin('Compte connecté mais non autorisé : ajoutez son e-mail dans la collection « acces » de Firestore.');}}
function makeDb(){return {
  doc(path){const r=fsdb.doc(path);return {
    set:o=>r.set(JSON.parse(JSON.stringify({...o,updated_by:fbUser?.email||null}))).catch(e=>{throw mapErr(e)}),
    delete:()=>r.delete().catch(e=>{throw mapErr(e)}),
    onSnapshot:(fn)=>r.onSnapshot(s=>fn({exists:s.exists,data:()=>s.data()}),denied)}},
  collection(p){let q=fsdb.collection(p);const api={orderBy(f,d){q=q.orderBy(f,d);return api},limit(n){q=q.limit(n);return api},
    onSnapshot(fn){return q.onSnapshot(s=>fn({docs:s.docs.map(d=>({data:()=>d.data()}))}),denied)}};return api}}}
dlApi={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return 'saved'}};
function showLogin(msg){$('#login').hidden=false;$('#login-err').textContent=msg||'';setTimeout(()=>$('#l-mail')?.focus(),50)}
let started=false;
function startSession(user){fbUser=user;$('#login').hidden=true;$('#who').textContent=user.email;$('#who-box').hidden=false;if(started)return;started=true;
  db=makeDb();if(view==='devis')renderDevis();
  db.doc('config/societe').onSnapshot(s=>{socDb=s.exists?s.data():null;if(view==='soc'&&!socDraft)renderSoc()},()=>{});
  db.doc('config/catalogue').onSnapshot(s=>{
    if(s.exists&&Array.isArray(s.data().items)){catalog=migrateCat(clone(s.data().items));catFromDb=true;ruleCache.clear();
      if(view==='devis'&&!document.activeElement?.closest('#v-devis input,#v-devis textarea'))renderDevisKeepScroll();
      if(view==='tarifs'&&!catDraft)renderTarifs();}
    else if(!s.exists){toast('Aucun tarif en base : onglet Tarifs → Importer le fichier de tarifs, puis Enregistrer.')}});
  db.collection('devis').orderBy('updated','desc').limit(500).onSnapshot(s=>{
    savedList=s.docs.map(d=>d.data());$('#cnt').textContent=savedList.length?String(savedList.length):'';
    if(view==='liste'&&!document.activeElement?.closest('#v-liste'))renderListe();});}
(()=>{
  const cfg=window.HYDREAU_FIREBASE||{};
  if(!window.firebase||!cfg.apiKey||/VOTRE/.test(cfg.apiKey)){showLogin('Configuration manquante : renseignez config.js (configuration Firebase).');return}
  firebase.initializeApp(cfg);fsdb=firebase.firestore();const auth=firebase.auth();
  auth.onAuthStateChanged(u=>{if(u)startSession(u);else showLogin()});
  $('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-err').textContent='';$('#l-go').disabled=true;
    try{await auth.signInWithEmailAndPassword($('#l-mail').value.trim().toLowerCase(),$('#l-pass').value)}
    catch(err){$('#login-err').textContent='E-mail ou mot de passe incorrect.'}finally{$('#l-go').disabled=false}});
  $('#l-forgot').addEventListener('click',async()=>{const m=$('#l-mail').value.trim();if(!m){$('#login-err').textContent='Saisissez d’abord votre e-mail.';return}
    try{await auth.sendPasswordResetEmail(m);$('#login-err').textContent='E-mail de réinitialisation envoyé.'}catch(e){$('#login-err').textContent='Envoi impossible pour cette adresse.'}});
  $('#b-logout').addEventListener('click',async()=>{await auth.signOut();location.reload()});
})();
</script>
